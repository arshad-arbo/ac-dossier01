# Deploy static site to Azure Web App
# yamllint disable rule:line-length rule:truthy

---
name: Deploy AC-Dossier

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Create deployment package
        run: |
          zip -r webapp.zip . \
            -x '.git/*' \
               '.github/*' \
               'webapp.zip'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: webapp.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AC-Dossier'
          slot-name: 'Production'
          package: webapp.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ABB644233C93420DB914BCB716FC5578 }}
