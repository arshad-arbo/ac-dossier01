<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Functiemanagement</title>
  <style>
  /* === Styles collected from ac-dossier__met_kd-integratie_reports_suite_fixed.html === */
  
    /* ================= THEMA (kleurcodes uit screenshot) ================= */
    :root{
      --bg: #ffffff;                /* website_theme_color */
      --primary: #ec641a;           /* website_kleur1  CTA / primaire */
      --teal: #79c6c0;              /* website_kleur2  OK/positief */
      --accent: #85cee4;            /* website_kleur3  info/accent */
      --slate: #686c7c;             /* website_kleur4  neutraal donker */
      --ink: #4c505a;               /* website_kleur5  koppen/contrast */
      --steel: #69a1b1;             /* website_kleur6  links/hover */
      --surface: #f7f7f7;           /* website_kleur8  app-achtergrond */

      --ok: var(--teal);
      --warn: var(--primary);
      --late: var(--ink);

      --ring: 1px solid #e5e7eb;
      --radius: 14px;
      --shadow: 0 6px 24px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    body{margin:0;background:var(--surface);color:#1f2a37;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial}
    a{color:var(--steel);text-decoration:none}
    a:hover{text-decoration:underline}

    .btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid #e5e7eb;background:#fff;color:#111;padding:.55rem .9rem;border-radius:12px;cursor:pointer}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
    .btn.small{padding:.35rem .6rem;border-radius:10px;font-size:.9rem}
    .tag{display:inline-block;padding:.18rem .5rem;border-radius:10px;font-size:.75rem}
    .tag.ok{background:var(--ok);color:#073b3a}
    .tag.warn{background:var(--warn);color:#fff}
    .tag.late{background:var(--late);color:#fff}

    input,select,textarea{width:100%;padding:.6rem .7rem;border-radius:12px;border:1px solid #d1d5db;background:#fff}
    label{font-weight:600;font-size:.9rem}
    .row{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    .col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}
    .col-8{grid-column:span 8}.col-9{grid-column:span 9}.col-12{grid-column:span 12}
    .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:var(--ring)}
    .surface{background:var(--surface);border:var(--ring)}
    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{padding:8px;border-bottom:1px solid #eef2f7;text-align:left}
    .muted{color:#5b6977}
    .hidden{display:none!important}

    /* ================= SHELL ================= */
    header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e5e7eb}
    .topbar{display:flex;align-items:center;gap:16px;padding:10px 16px}
    .logo{height:28px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}
    .brand small{font-weight:600;color:var(--slate)}
    .search{flex:1;display:flex;gap:10px}
    .search input{max-width:460px}
    nav{background:linear-gradient(90deg,#fff,#fdf5f0)}
    .menu{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;position:relative}
    .menu a{padding:.55rem .8rem;border-radius:12px;color:#334155;display:inline-block}
    .menu a.active{background:var(--primary);color:#fff}
    /* dropdown */
    .dropdown{position:relative;display:inline-block}
    .dropdown-toggle{padding:.55rem .8rem;border-radius:12px;color:#334155;display:inline-block}
    .dropdown:hover .dropdown-toggle,
    .dropdown.open .dropdown-toggle{background:var(--primary);color:#fff}
    .submenu{position:absolute;top:38px;left:0;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:var(--shadow);display:none;min-width:220px;padding:6px}
    .dropdown.open .submenu{display:block}
    .submenu a{display:block;padding:.5rem .7rem;border-radius:10px}
    .submenu a:hover{background:#f3f4f6}
    .app{max-width:1200px;margin:18px auto;padding:0 16px 60px}

    /* ================= DASHBOARD ================= */
    #widgets{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    .widget{grid-column:span 6;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:var(--ring);min-height:120px;display:flex;flex-direction:column}
    .widget header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #eef2f7;background:#fff;border-radius:12px 12px 0 0}
    .widget .body{padding:12px}
    .drag{cursor:grab;color:#64748b}
    .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
    .status-dot.ok{background:var(--ok)} .status-dot.warn{background:var(--warn)} .status-dot.late{background:var(--late)}

    /* calendar */
    .calendar{display:grid;grid-template-columns:80px repeat(5,1fr);gap:8px}
    .cal-col{background:#fff;border:1px solid #e5e7eb;border-radius:12px;min-height:320px;overflow:auto}
    .cal-hour{height:42px;border-bottom:1px dashed #eef2f7;padding:6px}
    .slot{background:var(--accent);color:#04364a;border-radius:8px;margin:6px;padding:6px}

    /* KEURINGSDOSSIERS (module navigatie) */
    .kd-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px}
    .kd-nav{background:#fff;border:var(--ring);border-radius:14px;overflow:hidden}
    .kd-nav h3{margin:0;padding:14px 16px;border-bottom:1px solid #e5e7eb;background:#fff;font-size:16px;font-weight:800;color:var(--ink)}
    .kd-list{list-style:none;margin:0;padding:0}
    .kd-btn{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;background:transparent;border:0;padding:12px 16px;cursor:pointer}
    .kd-btn:hover,.kd-btn.active{background:#fff4ed}
    .kd-dot{width:16px;height:16px;border-radius:50%;background:#cbd5e1}
    .kd-dot.open{background:var(--warn)} .kd-dot.done{background:var(--ok)}

    /* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
  perspective:1200px;transform-style:preserve-3d}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{--s:1;--rx:0deg;--ry:0deg;--tz:0px;--ty:0px;
  display:grid;grid-template-rows:auto 1fr;gap:10px;
  padding:18px;border:1px solid #eef2f7;border-radius:14px;background:#fff;
  transform:translateZ(var(--tz)) translateY(var(--ty)) scale(var(--s)) rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .16s cubic-bezier(.2,6,2,1),box-shadow .16s ease,border-color .16s ease;
  box-shadow:var(--shadow);position:relative;text-decoration:none;color:inherit;will-change:transform}
.tile:hover,.tile:focus-visible{--s:1.08;--tz:26px;--ty:-6px;border-color:#e3e8ee;box-shadow:var(--shadow-lg);outline:none}
.tile .top{display:flex;align-items:center;gap:12px}
.tile .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:#fff3eb;border:1px solid #ffd9c3}
.tile svg{width:26px;height:26px;fill:var(--primary)}
.tile strong{font-size:1.05rem}
.tile p{margin:0;color:#6b7280;font-size:.95rem}


    /* ADMIN (Applicatie instellingen) */
    .admin-wrap{display:grid;grid-template-columns:260px 1fr;gap:16px}
    .sidenav{background:#fff;border:var(--ring);border-radius:14px;overflow:hidden}
    .sidenav h3{margin:0;padding:14px 16px;border-bottom:1px solid #e5e7eb;font-size:16px}
    .sidenav a{display:block;padding:.6rem .9rem;color:#334155}
    .sidenav a.active{background:#fff4ed;color:#111;border-left:4px solid var(--primary)}
    .admin-pane .section{display:none}
    .admin-pane .section.active{display:block}

    @media (max-width: 980px){
      .kd-wrap{grid-template-columns:1fr}
      .admin-wrap{grid-template-columns:1fr}
      .widget{grid-column:span 12}
      .col-6,.col-8,.col-4{grid-column:span 12}
    }
  
/* === UI polish: Werkgever zoeken === */
.wg-zoek { --gap: 14px; }
.wg-zoek .row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.wg-zoek .col-5, .wg-zoek .col-7 { grid-column: auto; } /* fallback; explicit cols below */
@media (min-width: 900px){
  .wg-zoek .col-5 { grid-column: 1 / span 1; }
  .wg-zoek .col-7 { grid-column: 2 / span 1; }
}
.wg-zoek .toolbar { display: grid; grid-template-columns: 1fr auto; gap: var(--gap); align-items: end; }
.wg-zoek .search-input { width: 100%; padding: 12px 14px; font-size: 1rem; border: 1px solid var(--ink, #4c505a20); border-radius: 10px; background:#fff; }
.wg-zoek .btn { padding: 10px 14px; border-radius: 10px; }
.wg-zoek #companyList { display: flex; flex-direction: column; gap: 10px; }
.wg-zoek #companyList .card { padding: 12px 14px; border-radius: 14px; cursor: pointer; }
.wg-zoek #companyList .card:focus { outline: 2px solid var(--accent, #85cee4); outline-offset: 2px; }
.wg-zoek #companyList .card strong { display: inline-block; margin-right: 6px; }
.wg-zoek #companyList .card .muted { display: inline-block; margin-left: 6px; }
.wg-zoek #companyTabs { margin-top: var(--gap); }
.wg-zoek #companyPane { padding: 14px; }
.wg-zoek #companyPane label { margin-top: 8px; display:block; font-weight: 600; }
.wg-zoek #companyPane input { width: 100%; padding: 10px 12px; border: 1px solid var(--ink, #4c505a20); border-radius: 10px; }
.wg-zoek h3 { margin-top: 0; }
/* === NEW: Verzuim registratie (UI) === */
.vrz-wrap{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:980px){.vrz-wrap{grid-template-columns:340px 1fr}}
.vrz-list .card{cursor:pointer}
.vrz-list .card:focus{outline:2px solid var(--accent);outline-offset:2px}
.vrz-open-tag{display:inline-block;background:var(--warn);color:#fff;border-radius:8px;padding:.1rem .4rem;font-size:.75rem;margin-left:6px}
.vrz-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.vrz-tabs .btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.vrz-form h3{margin-top:0}
.vrz-two{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
@media(max-width:980px){.vrz-two{grid-template-columns:repeat(12,1fr)}}
.vrz-two .half{grid-column:span 6}.vrz-two .full{grid-column:span 12}.vrz-two .third{grid-column:span 4}
.vrz-help{color:#64748b;font-size:.9rem}
.vrz-note{background:#fff7ed;border:1px solid #fde1cc;color:#7a3b0c;border-radius:10px;padding:8px}
/* === NEW: Medisch dossier (UI) === */
.md-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.md-badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:.2rem .5rem;border-radius:999px;background:var(--surface);border:1px solid #e6e6e6}
.badge--ok{background:var(--teal);color:#063a35;border-color:var(--teal)}
.badge--accent{background:var(--accent);color:#0a2a3e;border-color:var(--accent)}
.md-list{margin:8px 0;border:1px solid #eee;border-radius:10px;overflow:hidden}
.md-list table{width:100%;border-collapse:separate;border-spacing:0}
.md-list thead th{background:var(--surface);text-align:left;padding:10px;border-bottom:1px solid #eee;color:var(--muted)}
.md-list td{padding:10px;border-bottom:1px solid #f2f2f2;vertical-align:top}
.md-right{margin-left:auto}
.md-clipboard{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border:1px dashed #cbd5e1;border-radius:10px;background:#fafafa}
.md-clipboard .chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #e5e7eb;background:var(--surface);padding:4px 8px;border-radius:999px}
.md-clipboard .chip .btn{border:none;background:transparent;cursor:pointer;opacity:.6}
.md-clipboard .empty{color:#94a3b8}
.md-pane{display:grid;grid-template-columns: minmax(260px, 320px) 1fr;gap:16px}
@media (max-width: 980px){ .md-pane{grid-template-columns:1fr} }
.md-pane .card{height:100%}
.md-section h3{margin:.5rem 0}
.md-actions{display:flex;gap:8px;flex-wrap:wrap}
.md-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.md-muted{color:var(--muted)}
/* === NEW: Overzichten & Filters === */
.filtersheet{position:fixed;top:0;right:0;bottom:0;width:360px;background:#fff;border-left:1px solid #e5e7eb;padding:16px;box-shadow:var(--shadow);transform:translateX(100%);transition:transform .2s ease;z-index:60}
.filtersheet.open{transform:translateX(0)}
.filtersheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.filtersheet .fields{max-height:70vh;overflow:auto;padding-right:6px}
.filtersheet .actions{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;border-top:1px solid #eef2f7;background:#fff;display:flex;gap:8px;justify-content:flex-end}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.35rem .6rem;border-radius:999px;background:var(--accent);color:#04364a;border:1px solid #bbe1f1;cursor:pointer}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip button{all:unset;cursor:pointer;font-weight:700}
.table-sort{cursor:pointer;user-select:none}
.th-sort-asc::after{content:" ▲";font-size:.8em}
.th-sort-desc::after{content:" ▼";font-size:.8em}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.legend .item{display:flex;align-items:center;gap:6px}
.icon-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.icon-prio-hoog{background:#e11d48}.icon-prio-midden{background:#f59e0b}.icon-prio-laag{background:#10b981}
/* responsive */
@media (max-width: 980px){ .filtersheet{width:100%}}
/* === Management informatie (UI) === */
.mgmt-wrap { display:grid; grid-template-columns:320px 1fr; gap:16px }
@media (max-width: 980px){ .mgmt-wrap { grid-template-columns:1fr } }
.mi-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px }
.mi-tabs .btn.active { background:var(--primary); color:#fff; border-color:var(--primary) }
.mi-kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px }
.mi-kpi .k { padding:10px; border-radius:12px; border:1px solid #eef2f7; background:#fff }
.mi-kpi .v { font-weight:800; font-size:1.4rem }
.mi-chart-row { display:flex; align-items:center; gap:10px }
.mi-bar { height:10px; background:#f1f5f9; border-radius:999px; flex:1; overflow:hidden }
.mi-bar > span { display:block; height:100%; background:var(--primary); width:0% }
.mi-foot { font-size:.9rem; color:#64748b }
.mi-note { background:#fff7ed; border:1px solid #fde1cc; color:#7a3b0c; border-radius:10px; padding:8px }
.mi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px }
/* === NEW: Koppelingen & UWV (DigiZSM) === */
.kop-layout{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width: 980px){ .kop-layout{grid-template-columns:1fr} }
.kop-tree{border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fff}
.kop-tree .hdr{padding:10px;border-bottom:1px solid #eee;background:var(--surface);display:flex;align-items:center;justify-content:space-between}
.kop-tree .body{max-height:60vh;overflow:auto}
.kop-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #f2f2f2;cursor:pointer}
.kop-item.active{background:var(--accent) }
.kop-item small{color:var(--muted)}
.kop-chip{display:inline-flex;align-items:center;gap:6px;padding:.25rem .5rem;border-radius:999px;border:1px solid #e5e7eb;background:var(--surface)}
.kop-chip.ok{background:var(--teal);color:#063a35;border-color:var(--teal)}
.kop-chip.warn{background:#fff7ed;border-color:#fed7aa}
.kop-chip.err{background:#fee2e2;border-color:#fecaca}
.kop-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.kop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kop-card{border:1px solid #eee;border-radius:12px;padding:12px;background:#fff}
.kop-card h4{margin:.25rem 0}
.stat-val{font-size:1.4rem;font-weight:700;color:var(--ink)}
.progress{height:10px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--primary);width:0%}
.log-table{width:100%;border-collapse:separate;border-spacing:0}
.log-table th,.log-table td{padding:8px;border-bottom:1px solid #f2f2f2;text-align:left;vertical-align:top}
.log-badge{display:inline-block;padding:.15rem .4rem;border-radius:6px}
.log-info{background:#eef2ff}
.log-error{background:#fee2e2}
.kop-tabs{display:flex;gap:8px;margin-top:8px}
.kop-tabs button{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:.3rem .8rem;cursor:pointer}
.kop-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.kop-def{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kop-field{display:flex;flex-direction:column}
.kop-field label{font-size:.9rem;color:var(--muted)}
.kop-legend{display:flex;gap:10px;flex-wrap:wrap}
.kop-legend .item{display:flex;align-items:center;gap:6px}
.kop-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:.2rem .6rem;background:var(--surface);border:1px solid #e5e7eb}
.kop-wiz-steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.kop-wiz-steps .step{padding:.2rem .5rem;border-radius:999px;border:1px solid #e5e7eb;background:#fafafa}
.kop-wiz-steps .step.active{background:var(--accent)}
.kop-help{color:var(--muted);font-size:.9rem}
/* === NEW: Beheer & Autorisatie (UI) === */
.auth-wrap { display:grid; grid-template-columns:300px 1fr; gap:16px; }
@media (max-width: 980px){ .auth-wrap { grid-template-columns:1fr; } }

.auth-toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; }

.auth-chip { display:inline-flex; gap:6px; align-items:center; padding:.25rem .5rem; border-radius:999px; border:1px solid #e5e7eb; background:var(--surface); }
.auth-chip.ok { background:var(--teal); color:#063a35; border-color:var(--teal); }
.auth-chip.warn { background:#fff7ed; border-color:#fed7aa; }
.auth-chip.info { background:var(--accent); color:#0a2a3e; border-color:var(--accent); }

.auth-tabs { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.auth-tabs button { border:1px solid #e5e7eb; background:#fff; border-radius:999px; padding:.3rem .8rem; cursor:pointer; }
.auth-tabs button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

.auth-panel .card { background:#fff; }
.auth-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
.auth-field { display:flex; flex-direction:column; }
.auth-field label { font-size:.9rem; color:#64748b; }

/* boom/navigatie links */
.auth-tree { border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; background:#fff; }
.auth-tree .hdr { padding:10px; border-bottom:1px solid #e5e7eb; background:var(--surface); display:flex; align-items:center; justify-content:space-between; }
.auth-tree .body { max-height:60vh; overflow:auto; }
.auth-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid #f2f2f2; }
.auth-item:hover { background:#f9fafb; }
.auth-item .name { flex:1; }
.auth-item .meta { color:#94a3b8; font-size:.9rem; }
.auth-item .chk { margin-right:6px; }
.auth-item .auto-dot { width:12px; height:12px; border-radius:50%; background:#cbd5e1; display:inline-block; border:1px solid #e5e7eb; }
.auth-item .auto-dot.active { background:var(--accent); border-color:var(--accent); }

/* organisatiestructuur (kolomsgewijs bedrijven → afdelingen → werknemers) */
.org-tree { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
@media (max-width: 980px){ .org-tree { grid-template-columns:1fr; } }
.org-col { border:1px solid #eef2f7; border-radius:12px; background:#fff; min-height:220px; overflow:auto; }
.org-col header { padding:8px 10px; border-bottom:1px solid #eef2f7; background:var(--surface); font-weight:700; }
.org-list { list-style:none; margin:0; padding:0; }
.org-node { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid #f8fafc; }
.org-node:hover { background:#f9fafb; }
.org-node .count { margin-left:auto; color:#94a3b8; font-size:.85rem; }
.org-node .badge { background:var(--surface); }

/* hints / meldingen */
.auth-note { background:#fff7ed; border:1px solid #fde1cc; color:#7a3b0c; border-radius:10px; padding:8px; }
.auth-help { color:#64748b; font-size:.9rem; }

  <template id="tpl-functies">

      <!-- Panel host -->
      <div id="fnPane" class="mt" tabindex="0" aria-live="polite"></div>

  </template>

  <script>
  // === Script collected from ac-dossier__met_kd-integratie_reports_suite_fixed.html ===

    /* ===================== DEMO DATA ===================== */
    const state = {
      employees: [
{id:1, naam:'H. de Vries', bsn:'123456789', bedrijf:'Arbo Concern BV', afdeling:'Leiden', functie:'Monteur', status:'in dienst', normuren:40, uren:40, fte:1.0},
        {id:2, naam:'J. van Dijk', bsn:'987654321', bedrijf:'Arbo Concern BV', afdeling:'Katwijk', functie:'Planner', status:'ziek', normuren:40, uren:32, fte:0.80, ziek:{datum:'2025-08-10', pct:50}}
],
      companies: [
        {id:1, naam:'AC Noordwijk BV', polis:'PL-0091', contact:'michiel@ac.nl', afdelingen:['Leiden','Katwijk']}
      ],
      dossiers:[
        {empId:2, type:'Ziekte', open:true, taken:[
          {id:11, titel:'1e week contact werknemer', status:'nu', datum:'2025-08-18'},
          {id:12, titel:'Plan van Aanpak WIA', status:'gepland', datum:'2025-09-01'},
          {id:13, titel:'Evaluatie week 6', status:'te laat', datum:'2025-07-05'}
        ], notities:[], docs:[]}
      ],
      signals:[{type:'Frequent verzuim', msg:'Signaal voor H. de Vries', at:'vandaag'},{type:'Termijnbewaking', msg:'Week 6 evaluatie te laat', at:'gisteren'}],
      availability: []
    };

    /* ===================== ROUTER & MENU (incl. dropdown Werkgevers) ===================== */
    const routes = [
      {path:'#/', label:'Dashboard'},
      {path:'#/werkgevers', label:'Werkgevers', children:[{path:'#/organisatie', label:'Organisatiestructuur'}]},
      {path:'#/werknemers', label:'Werknemers'},
      {path:'#/dossiers', label:'Dossiers'},
      {path:'#/agenda', label:'Planning & Agenda'},
      {path:'#/taken', label:'Taken'},
      {path:'#/overzichten', label:'Overzichten & Filters'},
      {path:'#/verzuim', label:'Verzuim registratie'},
      {path:'#/medisch', label:'Medisch dossier'},
      {path:'#/koppelingen', label:'Koppelingen & UWV'},
      {path:'#/postvak', label:'Postvak'},
      {path:'#/management', label: 'Management informatie'},
      {path:'#/beheer', label:'Beheer & autorisatie'},
      {path:'#/rapportage', label:'Rapportage & Analyse'},
      {path:'#/functies', label:'Functiemanagement'},
      {path:'#/keuringsdossiers', label:'Keuringsdossiers'},
      {path:'#/instellingen/widgets', label:'Mijn widgets', hidden:true},
      {path:'#/app-instellingen', label:'Applicatie instellingen', hidden:true}
    ];
    const view = document.getElementById('view');
    const menu = document.getElementById('menu');

    function buildMenu(){
      menu.innerHTML='';
      routes.filter(r=>!r.hidden).forEach(r=>{
        if(r.children){
          const wrap=document.createElement('div'); wrap.className='dropdown';
          const t=document.createElement('a'); t.href=r.path; t.className='dropdown-toggle'; t.textContent=r.label;
          if (location.hash===r.path) t.classList.add('active');
          wrap.appendChild(t);
          const sub=document.createElement('div'); sub.className='submenu';
          r.children.forEach(c=>{
            const a=document.createElement('a'); a.href=c.path; a.textContent=c.label; sub.appendChild(a);
          });
          wrap.appendChild(sub);
          wrap.addEventListener('mouseenter', ()=>wrap.classList.add('open'));
          wrap.addEventListener('mouseleave', ()=>wrap.classList.remove('open'));
          wrap.addEventListener('click', (e)=>{ if(e.target===t){ e.preventDefault(); wrap.classList.toggle('open'); } });
          menu.appendChild(wrap);
        }else{
          const a=document.createElement('a'); a.href=r.path; a.textContent=r.label;
          if (location.hash===r.path || (!location.hash && r.path==='#/')) a.classList.add('active');
          menu.appendChild(a);
        }
      });
    }
    function navigate(){
      buildMenu();
      const h = location.hash || '#/';
      if (h.startsWith('#/werkgevers')) return renderTemplate('tpl-werkgevers', initCompany);
      if (h.startsWith('#/werknemers')) return renderTemplate('tpl-werknemers', initEmployees);
      if (h.startsWith('#/dossiers')) return renderTemplate('tpl-dossiers', initDossiers);
      if (h.startsWith('#/agenda')) return renderTemplate('tpl-agenda', initAgenda);
      if (h.startsWith('#/taken')) return renderTemplate('tpl-taken', initTasks);
      if (h.startsWith('#/overzichten')) return renderTemplate('tpl-overzichten', initOverzichten);
      if (h.startsWith('#/verzuim')) return renderTemplate('tpl-verzuim', initVerzuim);
      if (h.startsWith('#/medisch')) return renderTemplate('tpl-medisch', initMedisch);
      if (h.startsWith('#/koppelingen')) return renderTemplate('tpl-koppelingen', initKoppelingen);
      if (h.startsWith('#/postvak')) return renderTemplate('tpl-postvak', initPostvak);
      if (h.startsWith('#/rapportage')) return renderTemplate('tpl-rapportage');
      if (h.startsWith('#/management')) return renderTemplate('tpl-management', initManagement);
      if (h.startsWith('#/beheer')) return renderTemplate('tpl-beheer', initBeheer);
      if (h.startsWith('#/functies')) return renderTemplate('tpl-functies', initFunctions);
      if (h.startsWith('#/organisatie')) return renderTemplate('tpl-organisatie', initOrganisatie);
      if (h.startsWith('#/instellingen/widgets')) return renderTemplate('tpl-widgets-settings', renderWidgetSettings);
      if (h.startsWith('#/app-instellingen')) return renderTemplate('tpl-admin', initAdmin);
      if (h.startsWith('#/keuringsdossiers')) return renderTemplate('tpl-keurings', initKeuringsProto);
      renderTemplate('tpl-dashboard', initDashboard);
    }
    window.addEventListener('hashchange', navigate);
    function renderTemplate(id, after){ view.innerHTML = document.getElementById(id).innerHTML; after && after(); }

    /* ===================== DASHBOARD & WIDGETS ===================== */
    const CATALOG = [
      {id:'wTasks', name:'Taken (mijn)', render:renderWidgetTasks},
      {id:'wDossiers', name:'Dossiers (openstaand)', render:renderWidgetDossiers},
      {id:'wSignals', name:'Signalen', render:renderWidgetSignals},
      {id:'wAgenda', name:'Agenda (deze week)', render:renderWidgetAgenda}
    ];
    function getPrefs(){
      const enabled = JSON.parse(localStorage.getItem('widgetsEnabled')||'["wTasks","wDossiers","wSignals","wAgenda"]');
      const order = JSON.parse(localStorage.getItem('widgetsOrder')||JSON.stringify(enabled));
      return {enabled, order};
    }
    function initDashboard(){
      const {enabled, order} = getPrefs();
      const wrap = document.getElementById('widgets'); wrap.innerHTML='';
      order.filter(id=>enabled.includes(id)).forEach(id=>{
        const spec = CATALOG.find(c=>c.id===id);
        const el=document.createElement('div'); el.className='widget'; el.draggable=true; el.dataset.id=id;
        el.addEventListener('dragstart', onDragStart); el.addEventListener('dragover', e=>e.preventDefault()); el.addEventListener('drop', onDrop);
        el.innerHTML=`<header><strong>${spec.name}</strong><span class="drag">⠿</span></header><div class="body" id="${id}"></div>`;
        wrap.appendChild(el); spec.render(document.getElementById(id));
      });
      // KPI's (open taken, te laat, dossiers)
      const allTasks = state.dossiers.flatMap(d=>d.taken);
      const openTasks = allTasks.filter(t=>t.status!=='done');
      const lateTasks = openTasks.filter(t=>t.status==='te laat');
      document.getElementById('kpi-open').textContent = openTasks.length;
      document.getElementById('kpi-late').textContent = lateTasks.length;
      document.getElementById('kpi-dossiers').textContent = state.dossiers.length;
      // recent
      const recent = JSON.parse(localStorage.getItem('recentDossiers')||'[]');
      const recentDiv = document.getElementById('recentDossiers');
      if(recentDiv) recentDiv.innerHTML = recent.length? recent.map(r=>`<span class="btn small">${r}</span>`).join(' ') : 'Nog geen recente dossiers.';
    }
    // drag sort
    let dragId=null;
    function onDragStart(e){ dragId=e.currentTarget.dataset.id; }
    function onDrop(e){
      const targetId=e.currentTarget.dataset.id; if(!targetId||targetId===dragId) return;
      const prefs=getPrefs(); const i=prefs.order.indexOf(dragId); const j=prefs.order.indexOf(targetId);
      prefs.order.splice(j,0,prefs.order.splice(i,1)[0]); localStorage.setItem('widgetsOrder',JSON.stringify(prefs.order)); initDashboard();
    }
    function renderWidgetTasks(node){
      const rows=state.dossiers.flatMap(d=>d.taken).slice(0,6).map(t=>{
        const cls=t.status==='gepland'?'warn':(t.status==='te laat'?'late':'ok');
        return `<tr><td><span class="status-dot ${cls}"></span>${t.titel}</td><td class="muted">${t.datum||''}</td></tr>`;
      }).join('');
      node.innerHTML=`<table class="table"><tr><th>Taak</th><th>Datum</th></tr>${rows}</table><div class="mt"><a href="#/taken" class="btn small">Naar taken</a></div>`;
    }
    function renderWidgetDossiers(node){
      const rows=state.dossiers.map(d=>{ const emp=state.employees.find(e=>e.id===d.empId);
        return `<tr><td>${emp?.naam||'Onbekend'}</td><td>${d.type}</td><td>${d.open?'<span class="tag ok">open</span>':'gesloten'}</td></tr>`; }).join('');
      node.innerHTML=`<table class="table"><tr><th>Werknemer</th><th>Type</th><th>Status</th></tr>${rows}</table><div class="mt"><a href="#/dossiers" class="btn small">Naar dossiers</a></div>`;

        alert('Selecteer eerst een werknemer in de lijst.'); return null;

function highlightRow(tr){
      document.querySelectorAll('#empTable tr').forEach(r=> r.style.background='');

function calcFTE(norm, uren){
      norm = Number(norm||40); uren = Number(uren||0);
      if(norm<=0) return 0;
      let v = uren / norm;
      if(v<0) v = 0; if(v>1.5) v = 1.5;
      return v;
    }

function elfProef(bsn){
      if(!/^\d{9}$/.test(bsn)) return false;
      let sum = 0;
      for(let i=0;i<8;i++) sum += (9-i) * parseInt(bsn[i],10);
      sum -= parseInt(bsn[8],10);
      return sum % 11 === 0;
    }

    const q2 = (byId('tmSearch')?.value||'').toLowerCase();
    const typeSel = byId('tmType')?.value || '';
    const statusSel = byId('tmStatus')?.value || '';
    const range = _taskRange || 'alles';

    // flatten tasks with employee name
    const all = (state.dossiers||[]).flatMap(d => (d.taken||[]).map(t => ({
      ...t,
      emp: (state.employees||[]).find(e=>e.id===d.empId)?.naam || '',
      dossierId: d.id
    })));

    let list = all.slice();

    // main top select filter
    if (f==='open') list = list.filter(t => t.status!=='done' && t.status!=='geannuleerd');
    if (f==='late') list = list.filter(t => t.status==='te laat');
    if (f==='done') list = list.filter(t => t.status==='done');

    // extra toolbar filters
    if (typeSel)   list = list.filter(t => (t.type||'')===typeSel);
    if (statusSel) list = list.filter(t => (t.status||'')===statusSel);

    // range filter (week/maand/alles) using t.datum/t.due/t.start if present
    if (range!=='alles'){
      const now = new Date();
      const horizonDays = range==='week' ? 7 : 31;
      const inHorizon = (dtStr)=>{
        if(!dtStr) return true; // keep items without date
        const d = new Date(dtStr);
        if(isNaN(d)) return true;
        const diffDays = (d - now) / 86400000;
        return diffDays <= horizonDays;
      };
      list = list.filter(t => inHorizon(t.datum || t.due || t.start));
    }

    // combined search
    const needle = (q1 + ' ' + q2).trim();
    if (needle){
      const n = needle.toLowerCase();
      list = list.filter(t => (`${t.emp} ${t.titel||''} ${t.type||''}`).toLowerCase().includes(n));
    }

    // paint table
    const rows = list.map(t=>{
      const tag = t.status==='gepland' ? 'warn' : (t.status==='te laat' ? 'late' :
                  (t.status==='done' ? 'ok' : ''));
      const label = t.status==='gepland' ? 'Gepland' :
                    (t.status==='te laat' ? 'Te laat' :
                    (t.status==='done' ? 'Uitgevoerd' : (t.status||'Nu uitvoeren')));
      return `<tr>
        <td>${t.emp}</td>
        <td>${t.titel||''}</td>
        <td><span class="tag ${tag}">${label}</span></td>
        <td><button class="btn small" onclick="markDone(${t.id})">Voltooid</button></td>
      </tr>`;
    }).join('');

    const table = `<table class="table">
      <tr><th>Medewerker</th><th>Taak</th><th>Status</th><th></th></tr>
      ${rows || '<tr><td colspan="4" class="muted">Geen taken voor deze selectie</td></tr>'}
    </table>`;

    const listEl = document.getElementById('taskList');
    if(listEl) listEl.innerHTML = table;
  }

    /* ===================== MANAGEMENT INFORMATIE ===================== */

  // ---------- selectie helpers ----------
  function activeIn(emp, from, to){
    const s = asDate(emp.start); const e = emp.eind ? asDate(emp.eind) : addDays(to,0);
    return !(e < asDate(from) || s > asDate(to));
  }
  function matchScope(emp, scope, orgId){
    if (orgId==='ALL' || scope==='all') return true;
    if (scope==='company') return (emp.bedrijf && (`C-${emp.bedrijf}`.toUpperCase().includes(orgId.replace('C-','').toUpperCase()))) || false;
    if (scope==='dept') return (emp.afdeling && (`D-${emp.afdeling}`.toUpperCase().includes(orgId.replace('D-','').toUpperCase()))) || false;
    // holding (H-AC) => alles
    if (orgId.startsWith('H-')) return true;

  function selectedProtocols() {
    const p = new Set();
    if ($('miProtZiek').checked) p.add('Ziek');
    if ($('miProtZwanger').checked) p.add('Zwanger');
    if ($('miProtZwgAGV').checked) p.add('Ziek_agv');
    return p;

  // Filtered views
  function currentSlice() {
    const from = asDate($('miFrom').value || defFrom);
    const to   = asDate($('miTo').value || defTo);
    const scope = $('miScope').value;
    const orgId = $('miOrg').value;
    const epsAllowed = selectedProtocols();

    const emps = ds.employees.filter(e=>activeIn(e, from, to) && matchScope(e, scope, orgId));
    // episodes overlapping periode en protocolmatch (Zwanger: type==='Zwanger'; agv: we hebben geen aparte in demo)
    const eps = ds.verzuim.filter(v=>{
      const vFrom = asDate(v.start), vTo = v.eind?asDate(v.eind):to;
      const overlap = !(vTo < from || vFrom > to);
      const typeOk = (v.type==='Ziek' && epsAllowed.has('Ziek')) ||
                     (v.type==='Zwanger' && epsAllowed.has('Zwanger')) ||
                     (v.type==='Ziek a.g.v. zwangerschap' && epsAllowed.has('Ziek_agv'));
      return overlap && typeOk;
    });

    return { from, to, emps, eps };
  }

  // ---------- berekeningen ----------
  function kerngetallen() {
    const { from, to, emps, eps } = currentSlice();
    const empCount = emps.length;
    const fteTot = emps.reduce((s,e)=> s + (e.fte||1), 0);
    const nieuw = eps.filter(v => asDate(v.start) >= from && asDate(v.start) <= to).length;
    const lopend = eps.length;

    const availDays = emps.reduce((s,e)=> s + workingDays(from,to) * (e.fte||1), 0);
    const sickDays = eps.reduce((s,v)=> {
      const emp = emps.find(e=>e.id===v.empId); if (!emp) return s;
      const days = overlapWorkDays(v.start, v.eind||to, from, to);
      const pct = clamp01(v.pct||1);
      return s + days * pct * (emp.fte||1);
    }, 0);

    const zvp = availDays>0 ? (sickDays/availDays)*100 : 0;
    const zmf = empCount>0 ? (nieuw/empCount) : 0;
    const gzvd = (nieuw>0) ? (sickDays/nieuw) : 0;

    // per geslacht
    const perG = ['M','V'].map(g=>{
      const ge = emps.filter(e=>e.geslacht===g);
      const geAvail = ge.reduce((s,e)=> s + workingDays(from,to)*(e.fte||1),0);
      const geEps = eps.filter(v=>ge.some(e=>e.id===v.empId));
      const geSick = geEps.reduce((s,v)=>{
        const emp = ge.find(e=>e.id===v.empId); if(!emp) return s;
        return s + overlapWorkDays(v.start, v.eind||to, from, to) * clamp01(v.pct||1) * (emp.fte||1);
      },0);
      const geZvp = geAvail>0 ? (geSick/geAvail)*100 : 0;
      return { g, geAvail, geZvp };
    });

    return { empCount, fteTot, nieuw, lopend, zvp, zmf, gzvd, perG, availDays, sickDays };
  }

  function perMaand() {
    const { from, to } = currentSlice();
    const out = [];
    // iterate months between from and to
    let cur = new Date(from.getFullYear(), from.getMonth(), 1);
    while (cur <= to) {
      const mStart = new Date(cur.getFullYear(), cur.getMonth(), 1);
      const mEnd = new Date(cur.getFullYear(), cur.getMonth()+1, 0);
      const f = new Date(Math.max(from, mStart)); const t = new Date(Math.min(to, mEnd));
      const { emps, eps } = currentSlice();
      const avail = emps.reduce((s,e)=> s + workingDays(f,t)*(e.fte||1), 0);
      const sick  = eps.reduce((s,v)=>{
        const emp = emps.find(e=>e.id===v.empId); if(!emp) return s;
        return s + overlapWorkDays(v.start, v.eind||t, f, t) * clamp01(v.pct||1) * (emp.fte||1);
      },0);
      out.push({ ym: `${mStart.getFullYear()}-${String(mStart.getMonth()+1).padStart(2,'0')}`, avail, sick, zvp: avail? (sick/avail)*100 : 0 });
      cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    }
    return out;
  }

  function duurOverzicht() {
    const { from, to, emps, eps } = currentSlice();
    const cats = { KV:0, MLV:0, LV:0, ELV:0 }, aant = { KV:0, MLV:0, LV:0, ELV:0 };
    eps.forEach(v=>{
      const totalCalDays = (asDate(v.eind||to) - asDate(v.start)) / 86400000 + 1;
      const c = duurClass(Math.floor(totalCalDays));
      if (c!=='—') { cats[c] += overlapWorkDays(v.start, v.eind||to, from, to); aant[c] += 1; }
    });
    return { cats, aant };
  }

  function leeftijdsTabel() {
    const { from, to, emps, eps } = currentSlice();
    const classes = [
      '<=15','16-20','21-25','26-30','31-35','36-40','41-45','46-50','51-55','56-60','61-65','66-70','>70'
    ];
    const rows = classes.map(c=>({ c, werknemers:0, meldingen:0, dagen:0, zmf:0, gzvd:0, beschikbaar:0, zvp:0 }));
    function age(birth) {
      // demo: als geen geboortedatum, random
      const y = 1980 + Math.floor(Math.random()*25);
      const bd = new Date(`${y}-07-01`);
      const diff = (from.getFullYear()) - bd.getFullYear();
      return diff;
    }
    function bucket(a){
      if (a<=15) return '<=15'; if (a>=71) return '>70';
      const lo = Math.floor((a-16)/5)*5 + 16; const hi = lo+4; return `${lo}-${hi}`;
    }
    emps.forEach(e=>{
      const b = bucket(age(e.geboorte)); const r = rows.find(x=>x.c===b);
      const avail = workingDays(from,to)*(e.fte||1);
      r.werknemers++; r.beschikbaar += avail;
      const myEps = eps.filter(v=>v.empId===e.id);
      r.meldingen += myEps.length;
      const sick = myEps.reduce((s,v)=> s + overlapWorkDays(v.start, v.eind||to, from, to)*clamp01(v.pct||1)*(e.fte||1), 0);
      r.dagen += sick;
    });
    rows.forEach(r=>{
      r.zmf = r.werknemers? r.meldingen/r.werknemers : 0;
      r.gzvd = r.meldingen? r.dagen/r.meldingen : 0;
      r.zvp = r.beschikbaar? (r.dagen/r.beschikbaar)*100 : 0;
    });
    return rows.filter(r=>r.werknemers>0);
  }

  function availability() {
    const k = kerngetallen();
    const beschikbaarPct = 100 - (k.zvp || 0);
    const byG = k.perG.map(x=>({ g:x.g, pct: 100 - (x.geZvp||0) }));
    return { total: beschikbaarPct, byG };
  }

  function moving12() {
    const pm = perMaand();
    const out = [];
    for (let i=0;i<pm.length;i++){
      const start = Math.max(0, i-11);
      const sub = pm.slice(start, i+1);
      const avg = sub.reduce((s,x)=>s+x.zvp,0)/sub.length;
      out.push({ ym: pm[i].ym, avg });
    }
    return out;
  }

  function benchmark() {
    const { from, to, emps, eps } = currentSlice();
    // per bedrijf en afdeling
    const key = (e)=> `${e.bedrijf}||${e.afdeling}`;
    const map = new Map();
    emps.forEach(e=>{
      const k = key(e);
      if (!map.has(k)) map.set(k, { bedrijf:e.bedrijf, afdeling:e.afdeling, werknemers:0, fte:0, meldingen:0, dagen:0, beschikbaar:0 });
      const rec = map.get(k);
      rec.werknemers++; rec.fte += (e.fte||1);
      rec.beschikbaar += workingDays(from,to)*(e.fte||1);
    });
    eps.forEach(v=>{
      const e = emps.find(x=>x.id===v.empId); if (!e) return;
      const rec = map.get(key(e)); if (!rec) return;
      rec.meldingen += 1;
      rec.dagen += overlapWorkDays(v.start, v.eind||to, from, to) * clamp01(v.pct||1) * (e.fte||1);
    });
    const rows = [...map.values()].map(r=>({
      ...r,
      zmf: r.werknemers? r.meldingen/r.werknemers : 0,
      gzvd: r.meldingen? r.dagen/r.meldingen : 0,
      zvp: r.beschikbaar? (r.dagen/r.beschikbaar)*100 : 0
    }));
    return rows.sort((a,b)=> (a.bedrijf||'').localeCompare(b.bedrijf||'') || (a.afdeling||'').localeCompare(b.afdeling||''));
  }

  function costsPerMonth() {
    const { from, to, emps, eps } = currentSlice();
    const rows = [];
    let cur = new Date(from.getFullYear(), from.getMonth(), 1);
    while (cur <= to) {
      const mStart = new Date(cur.getFullYear(), cur.getMonth(), 1);
      const mEnd = new Date(cur.getFullYear(), cur.getMonth()+1, 0);
      const f = new Date(Math.max(from, mStart)); const t = new Date(Math.min(to, mEnd));
      const avail = emps.reduce((s,e)=> s + workingDays(f,t)*(e.fte||1), 0);
      const loonkosten = emps.reduce((s,e)=> {
        const dl = ds.dagloon.get(e.id) || 100;
        return s + dl * workingDays(f,t) * (e.fte||1);
      },0);
      const verzuimkost = eps.reduce((s,v)=>{
        const e = emps.find(x=>x.id===v.empId); if(!e) return s;
        const dl = ds.dagloon.get(e.id) || 100;
        const days = overlapWorkDays(v.start, v.eind||t, f, t);
        return s + dl * days * clamp01(v.pct||1) * (e.fte||1);
      },0);
      rows.push({ ym:`${mStart.getFullYear()}-${String(mStart.getMonth()+1).padStart(2,'0')}`, loonkosten, verzuimkost, pct: loonkosten? (verzuimkost/loonkosten)*100 : 0 });
      cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    }
    return rows;
  }

  function kpiTaken() {
    const { from, to } = currentSlice();
    const T = ds.tasks.filter(t => asDate(t.due) >= from && asDate(t.due) <= to);
    const done = T.filter(t=>t.done);
    const onTime = done.filter(t=> asDate(t.done) <= asDate(t.due));
    const late = done.filter(t=> asDate(t.done) > asDate(t.due));
    const avgLateDays = late.length ? late.reduce((s,t)=> s + Math.max(0,(asDate(t.done)-asDate(t.due))/86400000),0)/late.length : 0;
    const norm = done.reduce((s,t)=> s + (t.normMin||0),0);
    const act  = done.reduce((s,t)=> s + (t.actMin||0),0);
    return {
      rows: T.map(t=>({
        type:t.type, contract:t.contract, rol:t.rol,
        due:t.due, done:t.done||'—', tijdig: t.done && asDate(t.done)<=asDate(t.due)
      })),
      totaals:{ afgerond:done.length, normtijd:norm, werkelijk:act, tijdig:onTime.length, nietTijdig:late.length, avgLate:avgLateDays, pctTijdig: done.length? (onTime.length/done.length)*100 : 0 }
    };
  }

  function meldingenPerDag() {
    const { from, to, eps } = currentSlice();
    const nieuw = eps.filter(v=> asDate(v.start)>=from && asDate(v.start)<=to);
    return nieuw.sort((a,b)=> asDate(a.start)-asDate(b.start));
  }

  function frequentVerzuimers() {
    const { from, to, emps, eps } = currentSlice();
    const map = new Map();
    eps.forEach(v=>{ map.set(v.empId, (map.get(v.empId)||0)+1); });
    const rows = [...map.entries()].map(([id,count])=>{
      const e = emps.find(x=>x.id===id); if (!e) return null;
      return { naam:e.naam, bedrijf:e.bedrijf, afdeling:e.afdeling, meldingen:count };
    }).filter(Boolean).sort((a,b)=> b.meldingen - a.meldingen || a.naam.localeCompare(b.naam));
    return rows;
  }

  function renderFact() {
    const peil = asDate($('miPeil').value || fmt(today));
    // Groepeer per bedrijf
    const byBedrijf = {};
    ds.employees.forEach(e=>{
      const act = !e.eind || asDate(e.eind) >= peil;
      if (!act) return;
      byBedrijf[e.bedrijf] = byBedrijf[e.bedrijf] || { bedrijf:e.bedrijf, werknemers:0, dossiers:0, uwv:0, wia:0, sms1:0, sms30:0 };
      byBedrijf[e.bedrijf].werknemers++;
    });
    ds.verzuim.forEach(v=>{
      const open = (!v.eind || asDate(v.eind) >= peil);
      if (!open) return;
      const e = ds.employees.find(x=>x.id===v.empId); if (!e) return;
      byBedrijf[e.bedrijf] = byBedrijf[e.bedrijf] || { bedrijf:e.bedrijf, werknemers:0, dossiers:0, uwv:0, wia:0, sms1:0, sms30:0 };
      if (v.type==='Ziek') byBedrijf[e.bedrijf].dossiers++;
    });
    ds.wiaOpen.forEach(w=>{
      if (!byBedrijf[w.bedrijf]) byBedrijf[w.bedrijf] = { bedrijf:w.bedrijf, werknemers:0, dossiers:0, uwv:0, wia:0, sms1:0, sms30:0 };
      byBedrijf[w.bedrijf].wia += w.count||0;
    });
    const yest = fmt(addDays(peil,-1));
    const d30 = fmt(addDays(peil,-30));
    Object.values(byBedrijf).forEach(r=>{
      r.sms1 = ds.sms.find(s=>s.date===yest)?.count || 0;
      r.sms30 = ds.sms.filter(s=> s.date > d30 && s.date <= peil).reduce((s,x)=>s+x.count,0);
    });

    const tbody = $('miFactTbl').querySelector('tbody');
    tbody.innerHTML = Object.values(byBedrijf).sort((a,b)=>a.bedrijf.localeCompare(b.bedrijf))
      .map(r=>`<tr><td>${r.bedrijf}</td><td>${r.werknemers}</td><td>${r.dossiers}</td><td>0</td><td>${r.wia}</td><td>${r.sms1}</td><td>${r.sms30}</td></tr>`).join('');
  }

  // ---------- export ----------
  function exportCSV() {
    const { from, to } = currentSlice();
    const k = kerngetallen();
    const pm = perMaand();
    let csv = `Management informatie;${fmt(from)};${fmt(to)}\n`;
    csv += `Werknemers;${k.empCount}\nFTE;${k.fteTot.toFixed(2)}\nNieuwe meldingen;${k.nieuw}\nLopende meldingen;${k.lopend}\nZVP (%);${k.zvp.toFixed(2)}\nZMF;${k.zmf.toFixed(2)}\nGZVD (dagen);${k.gzvd.toFixed(1)}\n\n`;
    csv += `Maand;ZVP (%)\n` + pm.map(r=>`${r.ym};${r.zvp.toFixed(2)}`).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`management-info_${fmt(from)}_${fmt(to)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  // ---------- wire events ----------
  function renderAll() {
    renderKern(); renderPerMaand(); renderDuur(); renderAge(); renderAvail(); renderMov();
    renderBench(); renderCost(); renderKPI(); renderDaily(); renderFreq();
  }
  $('miApply').addEventListener('click', renderAll);
  $('miGen').addEventListener('click', renderAll);
  $('miFactRun').addEventListener('click', renderFact);
  $('miExport').addEventListener('click', exportCSV);

  // initial
  renderAll(); renderFact();
}

    els('.admin-pane .section').forEach(s=> s.classList.remove('active'));
    const node = el('#bh-'+key);
    if (!node){ console.warn('Section not found:', key); return; } // prevents crash
    node.classList.add('active');
    // lazy renders
    if (key==='users')   renderUsers();
    if (key==='auth')    renderAuth();
    if (key==='groups')  renderGroups();
    if (key==='roles')   renderRBAC();
    if (key==='audit')   renderAudit();
  }

  // ---------- Gebruikersoverzicht ----------
  function renderUsers(){
    els('[data-bh-type]').forEach(btn=>{
      btn.classList.toggle('primary', btn.getAttribute('data-bh-type')===selType);
      btn.onclick = ()=>{ selType=btn.getAttribute('data-bh-type'); renderUsers(); };
    });
    const q = ($('bhUserSearch')?.value||'').toLowerCase();
    const onlyWg = $('bhOnlyWerkgevers')?.checked;

    const rows = ds.users
      .filter(u=> (!onlyWg || u.type==='werkgever'))
      .filter(u=> (selType? u.type===selType : true))
      .filter(u=> [u.name,u.username,u.email].join(' ').toLowerCase().includes(q));

    const tb = el('#bhUserTable tbody'); if (!tb) return;
    tb.innerHTML = rows.map(u=>{
      const orgTxt = u.company ? companyName(u.company) : (u.holding? holdingName(u.holding) : '—');
      const val = u.validated ? '<span class="tag ok">Ja</span>' : '<span class="tag late">Nee</span>';
      return `<tr data-user="${u.id}" tabindex="0">
        <td>${u.name}</td><td>${u.type}</td><td>${u.username}</td><td>${u.email}</td><td>${orgTxt}</td><td>${val}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="6" class="muted">Geen gebruikers gevonden.</td></tr>`;

    els('#bhUserTable tbody tr').forEach(tr=>{
      tr.onclick = ()=>{ selUserId = tr.getAttribute('data-user'); $('bhSelUserTxt').textContent = currentUser().name; };
    });

    $('bhSelUserTxt').textContent = currentUser()?.name || '—';
    $('bhOpenAuth') && ($('bhOpenAuth').onclick = ()=>{ setSection('auth'); });
    $('bhExportUsers') && ($('bhExportUsers').onclick = exportUsers);
  }
  function exportUsers(){
    const th = ['Naam','Type','Gebruikersnaam','E-mail','Bedrijf/Holding','Gevalideerd'];
    const q = ($('bhUserSearch').value||'').toLowerCase();
    const onlyWg = $('bhOnlyWerkgevers').checked;
    const rows = ds.users
      .filter(u=> (!onlyWg || u.type==='werkgever'))
      .filter(u=> (selType? u.type===selType : true))
      .filter(u=> [u.name,u.username,u.email].join(' ').toLowerCase().includes(q))
      .map(u=>[
        u.name, u.type, u.username, u.email,
        u.company ? companyName(u.company) : (u.holding? holdingName(u.holding) : '—'),
        u.validated ? 'Ja' : 'Nee'
      ]);
    const csv = [th, ...rows].map(r=> r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='gebruikers.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),300);
  }

  // ---------- Autorisatie ----------
  function renderAuth(){
    const u = currentUser(); if (!u) return;
    $('bhAuthUser').textContent = `${u.name} (${u.username})`;
    $('bhAuthType').value = u.auth.type;

    show($('bhSpecifiek'), u.auth.type==='specifiek');
    show($('bhAutomatisch'), u.auth.type==='automatisch');
    show($('bhGroups'), u.auth.type==='groepen');

    // disable “automatisch” voor type werkgever
    els('#bhAuthType option').forEach(opt=>{
      if (opt.value==='automatisch') opt.disabled = (u.type==='werkgever');
    });

    $('bhAuthType').onchange = ()=>{ u.auth.type = $('bhAuthType').value; renderAuth(); };
    $('bhSaveAuto') && ($('bhSaveAuto').onclick = ()=> alert('Autorisatie opgeslagen (automatisch).'));
    $('bhSaveGroups') && ($('bhSaveGroups').onclick = ()=> alert('Groepsautorisatie opgeslagen.'));

    if (u.auth.type==='specifiek'){
      if (!selCompany) selCompany = u.auth.specific.companyIds[0] || Object.keys(ds.org.companies)[0];
      renderSpecCompanies(); renderSpecDepts(); renderSpecEmps();
    }
    if (u.auth.type==='groepen'){
      const box = $('bhGroupList');
      box.innerHTML = ds.groups.map(g=>{
        const checked = (u.auth.groups||[]).includes(g.id) ? 'checked' : '';
        return `<label style="display:block;margin:.2rem 0"><input type="checkbox" data-bh-group="${g.id}" ${checked}/> ${g.name}</label>`;
      }).join('') || '<div class="muted">Geen groepen aangemaakt.</div>';
      els('[data-bh-group]').forEach(chk=>{
        chk.onchange = ()=>{
          const id = chk.getAttribute('data-bh-group');
          u.auth.groups = u.auth.groups||[];
          if (chk.checked) { if (!u.auth.groups.includes(id)) u.auth.groups.push(id); }
          else { u.auth.groups = u.auth.groups.filter(x=>x!==id); }
        };
      });
    }

    // Exclude (eigen dossier)
    $('bhExUser') && ($('bhExUser').value = `${u.name} (${u.username})`);
    $('bhExRemove') && ($('bhExRemove').checked = !!u.excludeOwn);
    $('bhExOwnEmp') && ($('bhExOwnEmp').innerHTML = Object.values(ds.employees)
      .map(e=> `<option value="${e.id}" ${u.ownEmployee===e.id?'selected':''}>${empName(e.id)} — ${companyName(e.company)} / ${deptName(e.dept)}</option>`).join(''));
    $('bhExSave') && ($('bhExSave').onclick = ()=>{ u.ownEmployee = $('bhExOwnEmp').value || null; u.excludeOwn = $('bhExRemove').checked; alert('Exclusie opgeslagen.'); });

    // Verplaatsen (werkgever)
    $('bhMoveUser') && ($('bhMoveUser').value = (u.type==='werkgever') ? `${u.name} (${u.username})` : '(alleen voor werkgever)');
    $('bhMoveFrom') && ($('bhMoveFrom').value = (u.type==='werkgever') ? companyName(u.company) : '—');
    $('bhMoveTo') && ($('bhMoveTo').innerHTML = Object.values(ds.org.companies).map(c=> `<option value="${c.id}" ${u.company===c.id?'selected':''}>${c.name}</option>`).join(''));
    $('bhDoMove') && ($('bhDoMove').onclick = ()=>{
      if (u.type!=='werkgever') return alert('Verplaatsen is alleen voor type werkgever.');
      const to = $('bhMoveTo').value; const fromName = companyName(u.company);
      u.company = to; $('bhMoveFrom').value = companyName(u.company);
      alert(`Gebruiker verplaatst van “${fromName}” naar “${companyName(to)}”. Autorisaties zo nodig handmatig uitbreiden.`);
    });

    // Wachtwoord reset (demo flow conform use-case + OWASP)
    $('bhResetSend') && ($('bhResetSend').onclick = ()=>{
      const user = ($('bhResetUser').value||'').trim().toLowerCase();
      const mail = ($('bhResetMail').value||'').trim().toLowerCase();
      const found = ds.users.find(x=> x.username.toLowerCase()===user && x.email.toLowerCase()===mail);
      if (!found){ $('bhResetMsg').textContent = 'Indien bekend is een reset verstuurd.'; show($('bhResetForm'), false); return; } // uniform message
      if (!found.validated){ $('bhResetMsg').textContent = 'Account (nog) niet gevalideerd; reset geblokkeerd.'; show($('bhResetForm'), false); return; }
      $('bhResetMsg').textContent = 'Resetlink verzonden (simulatie). Stel nieuw wachtwoord hieronder in.'; show($('bhResetForm'), true);
      $('bhDoReset').onclick = ()=>{
        const a=$('bhNewPw').value, b=$('bhNewPw2').value; if (!a || a!==b) return alert('Wachtwoorden ongelijk.');
        alert('Wachtwoord gewijzigd.'); $('bhNewPw').value=$('bhNewPw2').value=''; show($('bhResetForm'), false);
      };
    });
  }
  function renderSpecCompanies(){
    const u = currentUser(); const spec = ensureSpec(u); const div = $('bhTreeCompanies');
    const comps = Object.values(ds.org.companies).sort((a,b)=> a.name.localeCompare(b.name));
    div.innerHTML = comps.map(c=>{
      const checked = spec.companyIds.includes(c.id) ? 'checked' : '';
      const auto = spec.autoCompanyIds.includes(c.id) ? 'style="color:var(--primary)"' : '';
      const active = (selCompany===c.id) ? ' class="chip"' : '';
      return `<div${active} style="display:flex;align-items:center;gap:8px;margin:4px 0">
        <input type="checkbox" data-bh-c="${c.id}" ${checked}/>
        <button class="btn small" data-bh-csel="${c.id}">${c.name}</button>
        <button class="btn small" data-bh-cauto="${c.id}" ${auto}>● auto</button>
      </div>`;
    }).join('') || '<div class="muted">Geen bedrijven.</div>';
    els('[data-bh-c]').forEach(ch=> ch.onchange=()=>{ toggle(spec.companyIds, ch.getAttribute('data-bh-c'), ch.checked); });
    els('[data-bh-csel]').forEach(b=> b.onclick=()=>{ selCompany=b.getAttribute('data-bh-csel'); renderSpecDepts(); renderSpecEmps(); renderSpecCompanies(); });
    els('[data-bh-cauto]').forEach(b=> b.onclick=()=>{ const id=b.getAttribute('data-bh-cauto'); toggle(spec.autoCompanyIds, id, !spec.autoCompanyIds.includes(id)); renderSpecCompanies(); });
  }
  function renderSpecDepts(){
    const u = currentUser(); const spec = ensureSpec(u); const div = $('bhTreeDepartments');
    const c = ds.org.companies[selCompany]; if (!c){ div.innerHTML = '<div class="muted">Kies eerst een bedrijf.</div>'; return; }
    if (!selDept) selDept = c.departments[0] || null;
    const deps = (c.departments||[]).map(id=> ds.org.departments[id]).sort((a,b)=> a.name.localeCompare(b.name));
    div.innerHTML = deps.map(d=>{
      const checked = spec.deptIds.includes(d.id) ? 'checked' : '';
      const auto = spec.autoDeptIds.includes(d.id) ? 'style="color:var(--primary)"' : '';
      const active = (selDept===d.id) ? ' class="chip"' : '';
      return `<div${active} style="display:flex;align-items:center;gap:8px;margin:4px 0">
        <input type="checkbox" data-bh-d="${d.id}" ${checked}/>
        <button class="btn small" data-bh-dsel="${d.id}">${d.name}</button>
        <button class="btn small" data-bh-dauto="${d.id}" ${auto}>● auto</button>
      </div>`;
    }).join('') || '<div class="muted">Geen afdelingen.</div>';
    els('[data-bh-d]').forEach(ch=> ch.onchange=()=>{ toggle(spec.deptIds, ch.getAttribute('data-bh-d'), ch.checked); });
    els('[data-bh-dsel]').forEach(b=> b.onclick=()=>{ selDept=b.getAttribute('data-bh-dsel'); renderSpecEmps(); renderSpecDepts(); });
    els('[data-bh-dauto]').forEach(b=> b.onclick=()=>{ const id=b.getAttribute('data-bh-dauto'); toggle(spec.autoDeptIds, id, !spec.autoDeptIds.includes(id)); renderSpecDepts(); });
  }
  function renderSpecEmps(){
    const u = currentUser(); const spec = ensureSpec(u); const div = $('bhTreeEmployees');
    const d = ds.org.departments[selDept]; if (!d){ div.innerHTML = '<div class="muted">Kies eerst een afdeling.</div>'; return; }
    const emps = (d.employees||[]).map(id=> ds.employees[id]).sort((a,b)=> a.name.localeCompare(b.name));
    div.innerHTML = emps.map(e=>{
      const checked = spec.empIds.includes(e.id) ? 'checked' : '';
      return `<label style="display:block;margin:.2rem 0"><input type="checkbox" data-bh-e="${e.id}" ${checked}/> ${e.name}</label>`;
    }).join('') || '<div class="muted">Geen werknemers.</div>';
    els('[data-bh-e]').forEach(ch=> ch.onchange=()=>{ toggle(spec.empIds, ch.getAttribute('data-bh-e'), ch.checked); });
  }

  // ---------- Groepsbeheer ----------
  function renderGroups(){
    // lijst
    const q = ($('grpSearch')?.value||'').toLowerCase();
    const list = $('grpList'); if (!list) return;
    const rows = ds.groups.filter(g=> !q || g.name.toLowerCase().includes(q) || (g.tag||'').toLowerCase().includes(q));
    list.innerHTML = rows.map(g=> `<div class="org-node" data-grp="${g.id}">
      <strong>${g.name}</strong>${g.tag?` <span class="badge">${g.tag}</span>`:''}
      <span class="count">${g.companies.length + g.depts.length} items</span>
    </div>`).join('') || '<div class="muted">Nog geen groepen. Klik “+ Nieuwe groep”.</div>';
    els('[data-grp]').forEach(n=> n.onclick=()=>{ selGroupId = n.getAttribute('data-grp'); renderGroupEditor(); });
    // editor
    renderGroupEditor();
    // events
    $('grpNew') && ($('grpNew').onclick = ()=>{
      const id = 'g'+Math.random().toString(36).slice(2,7);
      ds.groups.push({ id, name:'Nieuwe groep', tag:null, companies:[], depts:[], rules:[] });
      selGroupId = id; renderGroups();
    });
    $('grpExport') && ($('grpExport').onclick = ()=>{
      const out = JSON.stringify(ds.groups, null, 2);
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'application/json'})); a.download='groepen.json'; a.click();
    });
    $('grpSearch') && ($('grpSearch').oninput = renderGroups);
  }
  function renderGroupEditor(){
    const g = ds.groups.find(x=>x.id===selGroupId);
    $('grpTitle').textContent = g ? g.name : 'Geen groep geselecteerd';
    $('grpMeta').textContent = g ? `id: ${g.id}` : '';
    show($('grpSave'), !!g); show($('grpDelete'), !!g);
    if (!g){ $('grpName') && ($('grpName').value=''); $('grpTag') && ($('grpTag').value=''); $('grpCompanies')&&( $('grpCompanies').innerHTML='' ); $('grpDepts')&&( $('grpDepts').innerHTML='' ); $('grpRules')&&( $('grpRules').innerHTML='' ); $('grpPreview')&&( $('grpPreview').innerHTML='' ); return; }

    // velden
    $('grpName').value = g.name || '';
    $('grpTag').value = g.tag || '';
    $('grpName').oninput = ()=> g.name = $('grpName').value;
    $('grpTag').oninput  = ()=> g.tag  = $('grpTag').value;

    // dropdowns
    $('grpCompanyAdd').innerHTML = Object.values(ds.org.companies).map(c=> `<option value="${c.id}">${c.name}</option>`).sort().join('');
    $('grpDeptCompany').innerHTML = ['','c1','c2','c3'].filter(cid=>ds.org.companies[cid]).map(cid=>`<option value="${cid}">${companyName(cid)}</option>`).join('');
    $('grpDeptCompany').onchange = ()=>{
      const cid = $('grpDeptCompany').value;
      const depts = (ds.org.companies[cid]?.departments||[]).map(did=> ds.org.departments[did]);
      $('grpDeptAdd').innerHTML = depts.map(d=> `<option value="${d.id}">${d.name}</option>`).join('');
    };
    $('grpDeptCompany').dispatchEvent(new Event('change'));

    // lijsten
    $('grpCompanies').innerHTML = g.companies.map(cid=> `<li class="org-node"><span class="name">${companyName(cid)}</span><button class="btn small" data-grp-remc="${cid}">Verwijder</button></li>`).join('') || '<li class="muted">Geen bedrijven.</li>';
    $('grpDepts').innerHTML = g.depts.map(did=> `<li class="org-node"><span class="name">${deptName(did)} — ${companyName(ds.org.departments[did]?.company)}</span><button class="btn small" data-grp-remd="${did}">Verwijder</button></li>`).join('') || '<li class="muted">Geen afdelingen.</li>';

    els('[data-grp-remc]').forEach(b=> b.onclick=()=>{ g.companies = g.companies.filter(x=>x!==b.getAttribute('data-grp-remc')); renderGroupEditor(); });
    els('[data-grp-remd]').forEach(b=> b.onclick=()=>{ g.depts = g.depts.filter(x=>x!==b.getAttribute('data-grp-remd')); renderGroupEditor(); });

    $('grpAddCompany').onclick = ()=>{ const cid = $('grpCompanyAdd').value; if (!cid) return; if (!g.companies.includes(cid)) g.companies.push(cid); renderGroupEditor(); };
    $('grpAddDept').onclick    = ()=>{ const did = $('grpDeptAdd').value; if (!did) return; if (!g.depts.includes(did)) g.depts.push(did); renderGroupEditor(); };

    // regels
    function paintRules(){
      $('grpRules').innerHTML = g.rules.map((r,i)=> `<div class="chip">IF <strong>${r.field}</strong> ${r.op} “${r.val}” <button class="rm" data-rule-rm="${i}">✕</button></div>`).join('') || '<div class="muted">Geen regels.</div>';
      els('[data-rule-rm]').forEach(btn=> btn.onclick=()=>{ g.rules.splice(parseInt(btn.getAttribute('data-rule-rm'),10),1); paintRules(); paintPreview(); });
    }
    $('grpAddRule').onclick = ()=>{
      const field=$('grpRuleField').value, op=$('grpRuleOp').value, val=($('grpRuleVal').value||'').trim();
      if (!val) return;
      g.rules.push({field,op,val}); $('grpRuleVal').value=''; paintRules(); paintPreview();
    };
    paintRules();

    // preview
    function applyRules(){
      const match = (txt, rule)=> {
        const v = txt.toLowerCase(); const x = rule.val.toLowerCase();
        if (rule.op==='contains') return v.includes(x);
        if (rule.op==='starts')   return v.startsWith(x);
        if (rule.op==='equals')   return v===x;
        return false;
      };
      const add = {companies:new Set(g.companies), depts:new Set(g.depts)};
      // companies
      Object.values(ds.org.companies).forEach(c=>{
        g.rules.filter(r=>r.field==='companyName').forEach(r=>{ if (match(c.name,r)) add.companies.add(c.id); });
      });
      // depts
      Object.values(ds.org.departments).forEach(d=>{
        g.rules.filter(r=>r.field==='deptName').forEach(r=>{ if (match(d.name,r)) add.depts.add(d.id); });
      });
      return { companies:[...add.companies], depts:[...add.depts] };
    }
    function paintPreview(){
      const out = applyRules();
      const empByDept = out.depts.flatMap(did=> (ds.org.departments[did]?.employees||[]));
      const empByComp = out.companies.flatMap(cid=>{
        const depts = ds.org.companies[cid]?.departments||[]; return depts.flatMap(did=> ds.org.departments[did]?.employees||[]);
      });
      const empSet = new Set([...empByDept, ...empByComp]);
      const empRows = [...empSet].map(eid=> `<li>${empName(eid)} — ${companyName(ds.employees[eid].company)} / ${deptName(ds.employees[eid].dept)}</li>`).join('');
      $('grpPreview').innerHTML = `
        <div class="row">
          <div class="col-6">
            <h4 style="margin-top:0">Bedrijven (${out.companies.length})</h4>
            <ul class="org-list">${out.companies.map(cid=>`<li class="org-node">${companyName(cid)}</li>`).join('')||'<li class="muted">Geen</li>'}</ul>
          </div>
          <div class="col-6">
            <h4 style="margin-top:0">Afdelingen (${out.depts.length})</h4>
            <ul class="org-list">${out.depts.map(did=>`<li class="org-node">${deptName(did)} — ${companyName(ds.org.departments[did].company)}</li>`).join('')||'<li class="muted">Geen</li>'}</ul>
          </div>
        </div>
        <div class="mt"><strong>Werknemers (${empSet.size})</strong><ul class="org-list">${empRows||'<li class="muted">Geen</li>'}</ul></div>
      `;
      return out;
    }
    paintPreview();

    // acties
    $('grpSave').onclick = ()=>{ alert('Groep opgeslagen.'); };
    $('grpDelete').onclick = ()=>{
      if (!confirm('Groep verwijderen?')) return;
      ds.groups = ds.groups.filter(x=>x.id!==g.id); selGroupId = ds.groups[0]?.id || null; renderGroups();
    };
    $('grpApplyToUser').onclick = ()=>{
      const u = currentUser(); if (!u) return alert('Geen gebruiker geselecteerd.');
      u.auth.type='groepen'; u.auth.groups = Array.from(new Set([...(u.auth.groups||[]), g.id]));
      setSection('auth'); renderAuth(); alert(`Groep “${g.name}” toegepast op ${u.name}.`);
    };
  }

  // ---------- RBAC ----------
  function renderRBAC(){
    const perms = [
      ['view_dossiers','Dossiers bekijken'], ['edit_dossiers','Dossiers bewerken'],
      ['manage_users','Gebruikers beheren'], ['view_medisch','Medisch dossier'], 
      ['export_data','Exporteren'], ['configure_koppelingen','Koppelingen beheren'], 
      ['open_ziekmelding','Ziek melden'], ['view_reports','Rapportage & KPI']
    ];
    const tbl = $('rbacTable'); if (!tbl) return;
    const head = ['<th>Rol</th>', ...perms.map(p=>`<th>${p[1]}</th>`)].join('');
    const body = ds.roles.map(r=> `<tr>
      <td><strong>${r.name}</strong></td>
      ${perms.map(p=>{
        const on = r.perms.includes(p[0]) ? 'checked' : '';
        return `<td><input type="checkbox" data-r="${r.id}" data-p="${p[0]}" ${on}></td>`;
      }).join('')}
    </tr>`).join('');
    tbl.innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
    els('[data-r][data-p]').forEach(ch=>{
      ch.onchange = ()=>{ const r = ds.roles.find(x=>x.id===ch.getAttribute('data-r')); const p = ch.getAttribute('data-p'); toggle(r.perms, p, ch.checked); };
    });
    $('rbacSave') && ($('rbacSave').onclick = ()=> alert('Rollen & rechten opgeslagen.'));
  }

  // ---------- Audit & sessies ----------
  function renderAudit(){
    const list = $('auditList'), sess=$('sessList'); if (!list || !sess) return;
    list.innerHTML = ds.audit.map(a=> `<div class="org-node"><span class="meta">${a.at}</span> — <strong>${a.who}</strong> ${a.act} <span class="muted">${a.what||''}</span></div>`).join('') || '<div class="muted">Leeg.</div>';
    sess.innerHTML = ds.sessions.map(s=> `<div class="org-node"><strong>${s.user}</strong> — ${s.ip} — ${s.ua}</div>`).join('') || '<div class="muted">Geen actieve sessies.</div>';
    $('sessKill') && ($('sessKill').onclick = ()=>{ ds.sessions=[]; renderAudit(); alert('Sessies beëindigd.'); });
    $('auditExport') && ($('auditExport').onclick = ()=>{
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(ds.audit,null,2)],{type:'application/json'})); a.download='audit.json'; a.click();
    });
    $('auditPurge') && ($('auditPurge').onclick = ()=>{ if(confirm('Auditlog legen?')){ ds.audit=[]; renderAudit(); } });
  }

  // ---------- side nav ----------
  els('.sidenav a').forEach(a=> a.onclick = ()=> setSection(a.getAttribute('data-bh-section')));

  // ---------- filters in gebruikers ----------
  $('bhUserSearch') && ($('bhUserSearch').oninput = renderUsers);
  $('bhOnlyWerkgevers') && ($('bhOnlyWerkgevers').onchange = renderUsers);

  // ---------- init ----------
  renderUsers(); renderAuth(); // eager
  setSection('users');         // default
}

    /* ===================== FUNCTIES ===================== */
function initFunctions(){
  // ---------- short-hands ----------
  const $ = (id) => document.getElementById(id);
  const q = (sel,root=document) => root.querySelector(sel);
  const qa = (sel,root=document) => [...root.querySelectorAll(sel)];

  function bindTabs(){
    qa('#fnTabs [role="tab"]').forEach((btn, idx, all)=>{

        if(e.key==='ArrowRight' || e.key==='ArrowLeft'){
          e.preventDefault();
          const dir = e.key==='ArrowRight' ? 1 : -1;
          const next = (idx + dir + all.length) % all.length;
          all[next].focus();
          setActive(all[next].dataset.tab);
        }
      });
    });

  function renderProfiel(){
    // Start from the current employee's functie for quick demo
    const emp = employees[0] || {naam:'—', functie:'Softwareontwikkelaar'};
    const taken = fnCatalog[emp.functie] || fnCatalog['Softwareontwikkelaar'];

    // Try to load a saved profiel for this functie

    const initPct = (t)=> saved?.tijdverdeling?.find(x=>x.taak===t.taak)?.pct ?? t.defaultPct;
    const initPrio= (t)=> saved?.prioriteit?.find(x=>x.taak===t.taak)?.rang ?? t.prio;
    const initBel = (t)=> saved?.belemmeringen?.[t.id] ?? false;

    pane.innerHTML = `

                <td><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" ${initBel(t)?'checked':''}/> Ja</label></td>
              </tr>
            `).join('')}
            <tr><td style="text-align:right"><strong>Totaal</strong></td><td colspan="3"><span class="muted" id="profTotal">0%</span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="muted">TIP: De som van de tijdverdeling moet ~100% zijn.</div>
    `;

    function calcTotal(){
      const vals = qa('#profTable tbody tr input[type="number"]').map(i=>Number(i.value||0));
      const tot = vals.reduce((a,b)=>a+b,0);
      $('profTotal').textContent = tot+'%';
      return tot;
    }
    pane.addEventListener('input', (e)=> { if (e.target.matches('input')) calcTotal(); });
    calcTotal();

    $('fnSave').addEventListener('click', ()=>{
      // collect
      const rows = qa('#profTable tbody tr[data-id]');
      const tijdverdeling = rows.map(tr=>({ taak: tr.children[0].textContent, pct: Number(q('input[type="number"]', tr).value||0) }));
      const prios = rows.map(tr=>({ taak: tr.children[0].textContent, rang: Number(qa('input[type="number"]', tr)[1].value||0) }));
      const bel  = rows.reduce((acc,tr)=>{ const id=tr.dataset.id; acc[id] = q('input[type="checkbox"]', tr).checked; return acc; }, {});

      const tot = tijdverdeling.reduce((a,b)=>a+b.pct,0);
      if (tot<98 || tot>102){ alert('Som van % moet ~100% zijn (nu: '+tot+'%)'); return; }
      const rangen = prios.map(x=>x.rang).filter(Boolean); const uniq=new Set(rangen);
      if (uniq.size!==rangen.length){ alert('Dubbele rang in prioriteit.'); return; }

      const all = loadProfiles().filter(p=>p.functie!==emp.functie);
      all.push({ functie:emp.functie, tijdverdeling, prioriteit:prios, belemmeringen:bel, savedAt:fmt(new Date()) });
      saveProfiles(all);
      alert('Profiel opgeslagen.');
    });

    $('fnDup').addEventListener('click', ()=>{
      const name = prompt('Dupliceer naar functienaam:', emp.functie+' (kopie)');
      if(!name) return;
      const rows = qa('#profTable tbody tr[data-id]');
      const tijdverdeling = rows.map(tr=>({ taak: tr.children[0].textContent, pct: Number(q('input[type="number"]', tr).value||0) }));
      const prios = rows.map(tr=>({ taak: tr.children[0].textContent, rang: Number(qa('input[type="number"]', tr)[1].value||0) }));
      const bel  = rows.reduce((acc,tr)=>{ const id=tr.dataset.id; acc[id] = q('input[type="checkbox"]', tr).checked; return acc; }, {});
      const all = loadProfiles();
      all.push({ functie:name, tijdverdeling, prioriteit:prios, belemmeringen:bel, savedAt:fmt(new Date()) });
      saveProfiles(all);
      alert('Profiel gedupliceerd als: '+name);
    });

    $('fnDel').addEventListener('click', ()=>{
      const all = loadProfiles().filter(p=>p.functie!==emp.functie);
      saveProfiles(all);
      alert('Profiel verwijderd (voor '+emp.functie+').');
    });
  }

  function renderAnalyse(){
    // Simple matrix WN vs LG using seeded responses for the first employee
    const emp = employees[0] || {id:'E1', naam:'—', functie:'Softwareontwikkelaar'};
    const rsps = loadResponses().filter(r=>r.werknemerId===emp.id);
    const wn = rsps.find(r=>r.rol==='WN' && r.functie===emp.functie);
    const lg = rsps.find(r=>r.rol==='LG' && r.functie===emp.functie);
    const taken = fnCatalog[emp.functie] || fnCatalog['Softwareontwikkelaar'];

    function valPct(answers, taak){ return answers?.tijdverdeling?.find(x=>x.taak===taak)?.pct; }
    function valRng(answers, taak){ return answers?.prioriteit?.find(x=>x.taak===taak)?.rang; }
    function bel(answers){ return answers?.belemmering?.ja ? 'Ja' : 'Nee'; }

    pane.innerHTML = `
      <div class="toolbar" style="justify-content:space-between">
        <div class="toolbar"><strong>${emp.naam}</strong><span class="muted"> – ${emp.functie}</span></div>
        <div class="toolbar">
          <button class="btn small" id="mxExport">Export CSV</button>
        </div>
      </div>
      <div class="mt" style="overflow:auto">
        <table class="table mx-table" id="mxTable">
          <thead><tr>
            <th>Taak</th><th>WN %</th><th>WN prio</th><th>WN belemmering</th>
            <th>LG %</th><th>LG prio</th><th>LG belemmering</th>
            <th>Mismatch</th>
          </tr></thead>
          <tbody>
            ${taken.map(t=>{
              const wnp = valPct(wn, t.taak) ?? t.defaultPct;
              const lgp = valPct(lg, t.taak) ?? t.defaultPct;
              const wnr = valRng(wn, t.taak) ?? t.prio;
              const lgr = valRng(lg, t.taak) ?? t.prio;
              const wnb = bel(wn), lgb = bel(lg);
              const mismatch = (Math.abs(wnp-lgp) > 15) || (wnb==='Ja' && lgb==='Nee') ? '⚠️' : '';
              return `<tr>
                <td>${t.taak}</td>
                <td>${wnp}%</td><td>${wnr}</td><td>${wnb}</td>
                <td>${lgp}%</td><td>${lgr}</td><td>${lgb}</td>
                <td>${mismatch}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="muted">Mismatch = |WN % – LG %| &gt; 15% of WN meldt belemmering maar LG niet (visuele badge).</div>
    `;

    $('mxExport').addEventListener('click', ()=>{
      const rows = [...q('#mxTable').querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.innerText.replace(/\n/g,' ').trim()));
      const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
      const a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      a.download='functiematrix.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 300);
    });
  }

  // ---------- top-level wiring ----------
  bindTabs();
  // screen-level actions
  $('fnExport').addEventListener('click', ()=>{
    const header = ['code','naam','sector','versie','laatst'];
    const csv = [header.join(';')].concat(fnList.map(r=> header.map(h=>r[h]).join(';'))).join('\n');

    a.download='functielijst.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 300);
  });
  $('fnNew').addEventListener('click', ()=> setActive('profiel'));

  // initial render
  setActive('overzicht');
}

function docsFromLibrary(key){
  try{
    var store = JSON.parse(localStorage.getItem('downloads')||'[]');
    var m = store.filter(function(d){ return (d||'').toLowerCase().indexOf(key) !== -1; });
    if(m.length) return m.map(function(name){ return {title:name, url:'#'}; });
  }catch(_){}
  return [
    {title:'Werkinstructie '+ key.charAt(0).toUpperCase()+key.slice(1)+' (PDF)', url:'#'},
    {title:'Checklist '+key, url:'#'}
  ];
}
function openWerkinstructies(ev, key, title){

  list.forEach(function(d){ h += '<a href="'+d.url+'" class="chip" target="_blank" rel="noopener">📄 '+d.title+'</a> '; });
  host.innerHTML = h;
  host.classList.toggle('hidden');
}

  // Sub-router under "#/keuringsdossiers"
function route(){
  const h = location.hash || '#/keuringsdossiers';

  // 1) Exact landing page
  if (h === '#/keuringsdossiers') {
    renderKdLanding(root);
    return;
  }

  // 2) Testen page (second step)
  if (h === '#/testen' || (h.startsWith('#/keuringsdossiers/keuringen') || h.startsWith('#/keuringsdossiers/keuringen'))) {
    renderTesten(root);
    return;
  }
  // 2b) Keuringsmodule (embedded prototype)
  if (h === '#/keuringsdossiers/keuringsmodule' || h.startsWith('#/keuringsdossiers/keuringsmodule')) {
    renderKeuringsModule(root);
    return;
  }

  // 2c) Projecten → Taken module
  if (h === '#/keuringsdossiers/projecten' || h.startsWith('#/keuringsdossiers/projecten')) {
    renderTaken(root);
    return;
  }


  // 3) Dossier screen (your existing mock)
  if (h.startsWith('#/keuringsdossiers/dossier')) {
    renderKeuringsDossier(root);
    return;
  }

  // Fallback to landing

window.KDData={
  makeDemoCohort(size=42){
    const dep=['HQ','Productie','HR','Facilitair'],cl=['Cluster A','Cluster B','Cluster C'];
    function rnd(a,b){return Math.round(a+Math.random()*(b-a));}
    let rows=[];for(let i=0;i<size;i++){rows.push({naam:'Demo '+(i+1),werkgever:'Demo BV',afdeling:dep[rnd(0,dep.length-1)],cluster:cl[rnd(0,cl.length-1)],stress:rnd(20,90),werkvermogen:rnd(20,45),slaap:rnd(20,90),alcohol:rnd(0,8),rookstatus:(Math.random()<.3?'rookt':'niet'),beweging:(Math.random()<.4?'onvoldoende':'voldoende'),bloeddruk_sys:rnd(100,170),bloeddruk_dia:rnd(60,105),bmi:rnd(18,38),buikomvang:rnd(75,120),geslacht:(Math.random()<.5?'m':'v'),audiometrie_4k:rnd(0,40),spraak:(Math.random()<.2?'onvoldoende':'voldoende'),visus_scherp:(Math.random()<.3?0.7:1.0),kleurenzien:(Math.random()<.1?'afwijkend':'normaal'),spiro_fev1:rnd(60,110),kans_score:rnd(20,90)});}return rows;
  },
  summarize(rows,key,groupBy){const map=new Map();rows.forEach(r=>{const g=groupBy?r[groupBy]:'all';const o=map.get(g)||{count:0,sum:0,values:[]};const v=r[key];if(v!=null&&v!==''&&!Number.isNaN(+v)){o.sum+=+v;o.values.push(+v);}o.count++;map.set(g,o);});const out=[];map.forEach((o,g)=>out.push({label:String(g),value:o.values.length?Math.round(o.sum/o.values.length):0,n:o.count}));return out;}
};
window.KDFlagger=function(row){
  const flags=[];
  Object.values(KD_FLAGS).forEach(cat=>{
    cat.items.forEach(it=>{
      const v=row[it.key]; const t=it.threshold||{}; let hit=false;
      if(t.flagIf!=null){const sv=String(v).toLowerCase(), sf=String(t.flagIf).toLowerCase(); hit=(sv===sf)||(sf.startsWith('<')&&+v<+sf.slice(1))||(sf.startsWith('>')&&+v>+sf.slice(1));}
      else if(t.high!=null && it.direction!=='lowIsRisk'){ hit= +v >= +t.high; }
      else if(t.low!=null  && (it.direction==='lowIsRisk'||true)){ hit= +v <= +t.low; }
      if(it.key==='buikomvang' && row.geslacht==='v' && t.femaleHigh){ hit = +v >= +t.femaleHigh; }
      if(hit) flags.push({category:cat.label,key:it.key,label:it.label,value:v});
    });
  });
  return flags;
};
