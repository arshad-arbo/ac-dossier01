function makeDossiers(n, open=true){
  const arr=[];
  for(let i=0;i<n;i++){
    const wg = rand(werkgeversDemo);
    const afd = rand(afdelingenDemo);
    const wn = rand(werknemersDemo)+' '+String.fromCharCode(65+Math.floor(Math.random()*26))+'.';
    arr.push({
      id:'D'+(open?'O':'G')+i,
      werknemer: wn,
      werkgever: wg,
      afdeling: afd,
      duur: Math.floor(Math.random()*365),
      herstel: Math.floor(Math.random()*100),
      at: Math.floor(Math.random()*15),
      reden: rand(verzuimRedenen),
      protocol: rand(protocolTypes),
      status: open?'open':'gesloten',
      manager: rand(['L. de Boer','M. Janssen','S. Koster','Y. van Dijk'])
    });
  }
  return arr;
}
function makeTaken(n){

  for(let i=0;i<n;i++){

    const afd = rand(afdelingenDemo);
    const wn = rand(werknemersDemo)+' '+String.fromCharCode(65+Math.floor(Math.random()*26))+'.';
    const st = rand(statusTaken);

      afdeling: afd,
      werknemer: wn,
      datum: due.toISOString().slice(0,10),
      status: st
    });
  }
  return arr;
}
function makeAfgerondeTaken(n){
  const arr = [];

      datum: done.toISOString().slice(0, 10), // afrondingsdatum

/* FilterManager */
function FilterManager(tableId, overviewKey, schema){
  this.tableId = tableId;
  this.key = overviewKey;
  this.schema = schema;
  this.criteria = {};      // {field:value}
  this.saved = [];         // [{id,name,criteria}]
  this.lastActive = null;  // id
  this.loadSaved();
}
FilterManager.prototype.loadSaved = function(){
  const raw = SafeStorage.getItem('filters::'+this.key);
  if(raw){
    try{ const obj = JSON.parse(raw);
      this.saved = obj.saved||[];
      this.lastActive = obj.lastActive||null;
      if(this.lastActive){
        const act = this.saved.find(f=>f.id===this.lastActive);
        if(act) this.criteria = {...act.criteria};
      }
    }catch(e){ console.warn('Corrupt filters storage',e); }
  }
};
FilterManager.prototype.persist = function(){
  SafeStorage.setItem('filters::'+this.key, JSON.stringify({saved:this.saved,lastActive:this.lastActive}));
};
FilterManager.prototype.reset = function(){ this.criteria={}; this.lastActive=null; };
FilterManager.prototype.save = function(name){
  const id = 'f_'+Date.now();
  this.saved.push({id,name,criteria:{...this.criteria}});
  this.lastActive = id;
  this.persist();
  return id;
};
FilterManager.prototype.rename = function(id,newName){
  const f=this.saved.find(x=>x.id===id); if(f){ f.name=newName; this.persist(); }
};
FilterManager.prototype.remove = function(id){
  this.saved = this.saved.filter(x=>x.id!==id);
  if(this.lastActive===id) this.lastActive=null;
  this.persist();
};
FilterManager.prototype.activate = function(id){
  const f = this.saved.find(x=>x.id===id);
  if(f){ this.criteria = {...f.criteria}; this.lastActive=id; this.persist(); }
};
FilterManager.prototype.search = function(data){
  // apply this.criteria on rows
  let rows = data.slice();
  for(const [k,v] of Object.entries(this.criteria)){
    if(v==null || v==='' || (Array.isArray(v) && !v.length)) continue;
    if(k==='duur' || k==='herstel' || k==='at'){
      const [min,max] = v; rows = rows.filter(r => r[k]>= (min??-Infinity) && r[k]<= (max??Infinity));
    }else if(k==='datum' && Array.isArray(v)){
      const [start,end] = v;
      rows = rows.filter(r => (!start || r.datum>=start) && (!end || r.datum<=end));
    }else if(k==='werknemer'){
      const q = String(v).toLowerCase();
      rows = rows.filter(r => (r.werknemer||'').toLowerCase().includes(q));
    }else if(k==='werkgever' || k==='afdeling' || k==='reden' || k==='protocol' || k==='manager' || k==='prioriteit' || k==='taaktype' || k==='status'){
      rows = rows.filter(r => String(r[k])===String(v));
    }
  }
  return rows;
};

/* ColumnManager */
function ColumnManager(tableId, overviewKey, spec){
  this.tableId = tableId;
  this.key = overviewKey;
  this.spec = spec.map(s => ({ defaultVisible: s.defaultVisible !== false, ...s }));
 // default: show all except locked enforced
  this.state = {visibleOrder: this.spec.map(s=>s.key), sort:{key:this.spec[0].key, dir:'asc'}};
  this.load();
}
ColumnManager.prototype.load = function(){
  const raw = SafeStorage.getItem('columns::'+this.key);
  if(raw){ try{ this.state=JSON.parse(raw);}catch(e){} }
};
ColumnManager.prototype.persist = function(){ SafeStorage.setItem('columns::'+this.key, JSON.stringify(this.state)); };
ColumnManager.prototype.apply = function(){
  const table = document.getElementById(this.tableId);
  if(!table) return;
  // header
  const head = document.getElementById('ovHead'); head.innerHTML='';
  for(const key of this.state.visibleOrder){
    const c = this.spec.find(s=>s.key===key); if(!c) continue;
    const th = document.createElement('th');
    th.textContent = c.label;
    th.tabIndex=0;
    th.classList.add('table-sort');
    th.dataset.key = key;
    if(this.state.sort.key===key) th.classList.add(this.state.sort.dir==='asc'?'th-sort-asc':'th-sort-desc');
    head.appendChild(th);
  }
};
ColumnManager.prototype.setSort = function(key, dir){
  this.state.sort = {key,dir};
  this.persist();
};

ColumnManager.prototype.openDialog = function(){
  const buildHtml = () => {
    const rows = this.state.visibleOrder.map(k => {
      const s = this.spec.find(x => x.key === k);
      const lock = s.locked ? 'disabled' : '';
      return `
        <div class="row" data-key="${k}" style="align-items:center;margin:.25rem 0">
          <div class="col-7">
            <label><input type="checkbox" checked ${lock}> ${s.label}${s.locked ? ' (vast)' : ''}</label>
          </div>
          <div class="col-5" style="text-align:right">
            <button class="btn small" data-act="up">↑</button>
            <button class="btn small" data-act="down">↓</button>
          </div>
        </div>`;
    }).join('');
    const sortOps = this.state.visibleOrder.map(k => {
      const s = this.spec.find(x => x.key === k);
      return `<option value="${k}" ${this.state.sort.key === k ? 'selected' : ''}>${s.label}</option>`;
    }).join('');
    return `
      <div>${rows}</div>
      <hr>
      <div class="row">
        <div class="col-7">
          <label>Standaard sortering</label>
          <select id="cmSortKey">${sortOps}</select>
        </div>
        <div class="col-5">
          <label>Richting</label>
          <select id="cmSortDir">
            <option value="asc" ${this.state.sort.dir === 'asc' ? 'selected' : ''}>Oplopend</option>
            <option value="desc" ${this.state.sort.dir === 'desc' ? 'selected' : ''}>Aflopend</option>
          </select>
        </div>
      </div>`;
  };

  const wireHandlers = () => {
    const body = document.getElementById('modalBody');
    body.querySelectorAll('.row[data-key]').forEach(row => {
      row.addEventListener('click', (e) => {
        const k = row.getAttribute('data-key');
        const idx = this.state.visibleOrder.indexOf(k);
        if (e.target.dataset.act === 'up' && idx > 0) {
          const tmp = this.state.visibleOrder[idx-1];
          this.state.visibleOrder[idx-1] = this.state.visibleOrder[idx];
          this.state.visibleOrder[idx] = tmp;
          body.innerHTML = buildHtml();
          wireHandlers();
        }
        if (e.target.dataset.act === 'down' && idx < this.state.visibleOrder.length - 1) {
          const tmp = this.state.visibleOrder[idx+1];
          this.state.visibleOrder[idx+1] = this.state.visibleOrder[idx];
          this.state.visibleOrder[idx] = tmp;
          body.innerHTML = buildHtml();
          wireHandlers();
        }
      });
    });
  };

  openModalHTML('Kolomindeling aanpassen', buildHtml(), () => {
    // Save sort selection on OK
    this.state.sort.key = document.getElementById('cmSortKey').value;
    this.state.sort.dir = document.getElementById('cmSortDir').value;
    this.persist();
    // Let the table rerender
    document.getElementById('ovTable').dispatchEvent(new Event('columns:changed'));
  });
  wireHandlers();
};


/* CSV export */
function tableToCSV(table, visibleRows){
  const head = Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());
  const body = visibleRows.map(tr => Array.from(tr.children).map(td=> `"${String(td.textContent).replace(/"/g,'""')}"`).join(','));
  return [head.join(','), ...body].join('\n');
}
function downloadCSV(name, csv){
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

/* === NEW: Overzichten init and rendering === */
function initOverzichten(){
  const view = document.getElementById('view');
  const sel = document.getElementById('ovType');
  const filterBtn = document.getElementById('ovFilterBtn');
  const columnsBtn = document.getElementById('ovColumnsBtn');
  const showAllBtn = document.getElementById('ovShowAll');
  const exportBtn = document.getElementById('ovExportCSV');
  const printBtn = document.getElementById('ovPrint');
  const tbody = document.getElementById('ovBody');
  const thead = document.getElementById('ovHead');
  const pager = document.getElementById('ovPager');
  const chips = document.getElementById('ovChips');
  const panel = document.getElementById('filterPanel');
  const fieldsWrap = document.getElementById('filterFields');
  const panelClose = document.getElementById('filterClose');
  const panelApply = document.getElementById('filterApply');
  const panelReset = document.getElementById('filterReset');
  const panelSave = document.getElementById('filterSave');

  let key = sel.value;
  let fm = new FilterManager('ovTable', key, FILTER_SCHEMAS[key]);
  let cm = new ColumnManager('ovTable', key, COLUMN_SPECS[key]);
  let pageSize = 25;
  let currentRows = [];

  function buildFilterFields(){
    fieldsWrap.innerHTML='';
    fm.schema.forEach(f=>{
      const wrap = document.createElement('div'); wrap.className='field mt';
      if(f.type==='select'){
        wrap.innerHTML = `<label>${f.label}</label>
          <select data-key="${f.key}"><option value="">-</option>${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`;
      }else if(f.type==='text'){
        wrap.innerHTML = `<label>${f.label}</label><input type="text" data-key="${f.key}" placeholder="Typ om te zoeken">`;
      }else if(f.type==='range'){
        const [min,max] = [f.min||0, f.max||100];
        wrap.innerHTML = `<label>${f.label}</label>
          <div class="row">
            <div class="col-6"><input type="number" data-key="${f.key}" data-range="min" min="${min}" max="${max}" placeholder="min"></div>
            <div class="col-6"><input type="number" data-key="${f.key}" data-range="max" min="${min}" max="${max}" placeholder="max"></div>
          </div>`;
      }else if(f.type==='daterange'){
        wrap.innerHTML = `<label>${f.label}</label>
          <div class="row">
            <div class="col-6"><input type="date" data-key="${f.key}" data-range="start"></div>
            <div class="col-6"><input type="date" data-key="${f.key}" data-range="end"></div>
          </div>`;
      }else if(f.type==='cascade' || f.type==='cascadeChild'){
        wrap.innerHTML = `<label>${f.label}</label>
          <select data-key="${f.key}"><option value="">-</option>${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`;
      }
      fieldsWrap.appendChild(wrap);
    });
    // restore values from fm.criteria
    for(const el of fieldsWrap.querySelectorAll('[data-key]')){
      const k=el.dataset.key, val=fm.criteria[k];
      if(val==null) continue;
      if(el.type==='number' && el.dataset.range){
        // handled via pair set below
      }else if(el.type==='date' && el.dataset.range){
        const pair = el.dataset.range==='start'?0:1;
        if(Array.isArray(fm.criteria[k])) el.value = fm.criteria[k][pair]||'';
      }else{
        el.value = val;
      }
    }
  }

  function openPanel(){ panel.classList.add('open'); setTimeout(()=>document.getElementById('filterTitle').focus(),10); }
  function closePanel(){ panel.classList.remove('open'); }
  panelClose.addEventListener('click', closePanel);
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closePanel(); });

  function renderSavedChips(){
    chips.innerHTML='';
    fm.saved.forEach(f=>{
      const chip = document.createElement('span'); chip.className='chip'+(fm.lastActive===f.id?' active':'');
      chip.innerHTML = `<span>${f.name}</span><button title="Wijzig" aria-label="Filter wijzigen">✎</button>`;
      chip.tabIndex=0;
      chip.addEventListener('click', (ev)=>{
        if(ev.target.tagName==='BUTTON') return;
        if(fm.lastActive===f.id){ fm.lastActive=null; fm.criteria={}; fm.persist(); render(); }
        else{ fm.activate(f.id); render(); }
      });
      chip.querySelector('button').addEventListener('click', ()=>{
        // rename or delete via modal
        const dlgBody = document.getElementById('app-modal-body'); const title = document.getElementById('app-modal-title');
        title.textContent='Filter wijzigen';
        dlgBody.innerHTML = `<label>Naam</label><input type="text" id="rfName" value="${f.name}">
          <div class="modal-actions">
            <button class="btn" id="rfDelete">Verwijderen</button>
            <span></span>
            <button class="btn" id="rfCancel">Annuleren</button>
            <button class="btn primary" id="rfSave">Opslaan</button>
          </div>`;
        openModal();
        document.getElementById('rfCancel').onclick=closeModal;
        document.getElementById('rfSave').onclick=()=>{ fm.rename(f.id, document.getElementById('rfName').value.trim()||f.name); closeModal(); renderSavedChips(); render(); };
        document.getElementById('rfDelete').onclick=()=>{ fm.remove(f.id); closeModal(); renderSavedChips(); render(); };
      });
      chips.appendChild(chip);
    });
  }

  function renderRows(rows){
    tbody.innerHTML='';
    const cols = cm.state.visibleOrder;
    const sortKey = cm.state.sort.key, dir = cm.state.sort.dir;
    rows.sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(typeof av==='string') av=av.toLowerCase();
      if(typeof bv==='string') bv=bv.toLowerCase();
      if(av<bv) return dir==='asc'?-1:1;
      if(av>bv) return dir==='asc'?1:-1;
      return 0;
    });
    currentRows = rows;
    // pagination
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total/pageSize));
    const page = 1;
    pager.innerHTML = `Totaal: ${total} rijen • Pagina 1/${pages} • <span class="muted">TIP: Gebruik “Toon alle” voor export.</span>`;

    const slice = rows.slice(0, pageSize);
    slice.forEach(r=>{
      const tr = document.createElement('tr');
      cols.forEach(k=>{
        const td = document.createElement('td');
        if(key==='openDossiers' || key==='geslotenDossiers'){
          if(k==='werknemer'){
            td.innerHTML = `<strong>${r.werknemer}</strong><div class="muted">${r.werkgever} • ${r.afdeling}</div>`;
          }else{
            td.textContent = r[k];
          }
        }else if(key==='openTaken'|| key==='bedrijfstaken' || key==='afgerondeTaken'){
          if(k==='taak'){
            const ic = TASK_ICONS[r.taaktype]||'•';
            td.innerHTML = `${ic} <strong>${r.taak}</strong> <span class="muted">(${r.taaktype})</span><div class="muted">${r.werknemer}</div>`;
          }else if(k==='prioriteit'){
            const map={'Hoog':'icon-prio-hoog','Midden':'icon-prio-midden','Laag':'icon-prio-laag'};
            td.innerHTML = `<span class="icon-dot ${map[r.prioriteit]}"></span> ${r.prioriteit}`;
          }else{
            td.textContent = r[k];
          }
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function render(){
    // apply column headers
    cm.apply();
    // add sorting events
    thead.querySelectorAll('th').forEach(th=>{
      th.addEventListener('click', ()=>{
        const k = th.dataset.key;
        const currentDir = (cm.state.sort.key===k && cm.state.sort.dir==='asc')?'desc':'asc';
        cm.setSort(k,currentDir); render();
      });
      th.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); th.click(); }});
    });
    // filter data
    const src = DATASETS[key];
    const rows = fm.search(src);
    renderRows(rows);
  }
  
  function rebuildForType(){
    key = sel.value;
    fm = new FilterManager('ovTable', key, FILTER_SCHEMAS[key]);
    cm = new ColumnManager('ovTable', key, COLUMN_SPECS[key]);
    buildFilterFields();
    renderSavedChips();
    pageSize = 25;
    render();
  }

  // Panel buttons
  filterBtn.onclick = ()=>{ buildFilterFields(); openPanel(); };

  const byName = (a,b)=> (a.naam||'').localeCompare(b.naam||'');
  const openSickFor = (empId)=> (state.dossiers||[]).find(d=>d.empId===empId && d.type==='Ziekte' && d.open);

    // haal verzuimredenen uit localStorage (Admin > Stamgegevens), anders demo-waarden
    try{
      const raw = JSON.parse(localStorage.getItem('verzuimredenen')||'[]');
      if (Array.isArray(raw) && raw.length) return raw.map(x=>typeof x==='string'?x:(x.naam||x.value)).filter(Boolean);
    }catch(_){}
    return ['Onbekend','Griep/verkoudheid','Blessure','Privé-omstandigheden','Arbeidsongeval']; // fallback
  }
  function taskCatalog(){
    try{
      const raw = JSON.parse(localStorage.getItem('taakbibliotheek')||'[]');
      if (Array.isArray(raw) && raw.length) return raw.map(x=>typeof x==='string'?x:(x.naam||x.value)).filter(Boolean);
    }catch(_){}
    return [];
  }
  function fillSelect(sel, items, withEmpty){
    sel.innerHTML = (withEmpty?'<option value="">(kies)</option>':'') + items.map(v=>`<option>${v}</option>`).join('');
  }

  function renderList(term=''){
    const q = (term||'').toLowerCase();
    const data = (state.employees||[]).filter(e=>{

    list.innerHTML = !data.length ? '<div class="muted">Geen resultaten</div>' :

/* Utilities */
function mdKey(prefix, wid, did){ return `med::${prefix}::${wid}::${did}`; }
function nowISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2,9) }

/* Storage helpers */
const MDStore = {
  list(type, wid, did){ return JSON.parse(localStorage.getItem(mdKey(type,wid,did))||'[]'); },
  save(type, wid, did, items){ localStorage.setItem(mdKey(type,wid,did), JSON.stringify(items)); },
  push(type, wid, did, item){ const arr=this.list(type,wid,did); arr.unshift(item); this.save(type,wid,did,arr); return arr; },
  clipGet(){ return JSON.parse(localStorage.getItem('med::clipboard')||'[]'); },
  clipSet(arr){ localStorage.setItem('med::clipboard', JSON.stringify(arr)); }
};

/* Minimal CRC32 + no-compression ZIP builder */
const CRC_TABLE = (()=>{ let c, table = new Uint32Array(256); for(let n=0;n!=256;n++){ c=n; for(let k=0;k!=8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1) } table[n]=c>>>0 } return table })();
function crc32(buf){ let c=0^(-1); for(let i=0;i<buf.length;i++){ c = (c>>>8) ^ CRC_TABLE[(c ^ buf[i]) & 0xFF]; } return (c ^ (-1))>>>0 }
function strToU8(s){ return new TextEncoder().encode(s) }
function u32(n){ const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n,true); return b }
function u16(n){ const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b }
/** files: [{name: 'path/file.txt', data: Uint8Array}] */
function makeZip(files){
  const parts = []; const central = []; let offset = 0;
  // DOS time/date
  const d=new Date(), dostime=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)) & 0xFFFF;
  const dosdate=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()) & 0xFFFF;

  function fileRecord(name, data){
    const crc = crc32(data), size = data.length;
    const nameU8 = strToU8(name);
    // local file header
    parts.push(
      strToU8('PK\x03\x04'),
      u16(20), u16(0), u16(0),
      u16(dostime), u16(dosdate),
      u32(crc), u32(size), u32(size),
      u16(nameU8.length), u16(0),
      nameU8, data
    );
    const localOffset = offset;
    offset += 30 + nameU8.length + size;

    // central directory header
    central.push(
      strToU8('PK\x01\x02'),
      u16(20), u16(20), u16(0), u16(0),
      u16(dostime), u16(dosdate),
      u32(crc), u32(size), u32(size),
      u16(nameU8.length), u16(0), u16(0),
      u16(0), u16(0), u32(0), u32(localOffset),
      nameU8
    );
  }

  for(const f of files){ fileRecord(f.name, f.data); }

  const startCentral = offset;
  for(const c of central){ parts.push(c); offset += c.reduce((n,arr)=>n+arr.length, 0); }

  // end of central directory record
  const centralSize = offset - startCentral;
  parts.push(
    strToU8('PK\x05\x06'),
    u16(0), u16(0), u16(central.length), u16(central.length),
    u32(centralSize), u32(startCentral), u16(0)
  );

  // flatten
  let total = 0; for(const p of parts){ total += p.length; }
  const out = new Uint8Array(total); let pos = 0;
  for(const p of parts){ out.set(p, pos); pos += p.length; }
  return out;
}

/* UI init */
function initKoppelingen(){
  const state = loadKop();
  const tree = byId('kopTree');
  const panel = byId('kopPanel');
  const tabs = document.querySelectorAll('.kop-tabs button');

  function current(){
    const a = state.aansluitingen.find(x=>x.id===state.sel.aansId) || state.aansluitingen[0];
    const k = a?.koppelingen.find(x=>x.id===state.sel.koppId) || a?.koppelingen[0];
    return {a,k};
  }

  function renderTree(filter=''){
    tree.innerHTML='';
    state.aansluitingen.forEach(a=>{
      if(filter && !a.naam.toLowerCase().includes(filter)) return;
      const aRow = document.createElement('div'); aRow.className='kop-item'; aRow.setAttribute('role','treeitem');
      if(state.sel.aansId===a.id && !state.sel.koppId) aRow.classList.add('active');
      aRow.innerHTML = `<div style="flex:1"><strong>${a.naam}</strong><div><small>ID ${a.id}</small></div></div>
        <span class="kop-chip ${a.actief?'ok':'warn'}">${a.actief?'Actief':'Inactief'}</span>`;
      aRow.addEventListener('click', ()=>{ state.sel={aansId:a.id, koppId:null}; saveKop(state); renderAll(); });
      tree.appendChild(aRow);

      a.koppelingen.forEach(k=>{
        if(filter && !(k.naam.toLowerCase().includes(filter))) return;
        const kRow = document.createElement('div'); kRow.className='kop-item'; if(state.sel.koppId===k.id) kRow.classList.add('active');
        kRow.style.paddingLeft='28px';
        kRow.innerHTML = `<div style="flex:1">${k.naam} <small>(${k.type})</small></div>
          <span class="kop-chip ${k.actief?'ok':'warn'}">${k.actief?'Actief':'Inactief'}</span>`;
        kRow.addEventListener('click', (e)=>{ e.stopPropagation(); state.sel={aansId:a.id, koppId:k.id}; saveKop(state); renderAll(); });
        tree.appendChild(kRow);
      });
    });
  }

  function setActiveTab(tab){ tabs.forEach(b=> b.classList.toggle('active', b.dataset.tab===tab)); }

  function renderPanel(){
    const {a,k} = current();
    const activeTab = document.querySelector('.kop-tabs button.active')?.dataset.tab || 'def';
    if(!a){ panel.innerHTML = '<div class="kop-card">Geen aansluiting gekozen.</div>'; return; }
    const btnToggle = byId('kopToggle'), btnEdit=byId('kopEdit'), btnStart=byId('kopStart'), btnAuto=byId('kopAuto'), btnActAans=byId('kopActAans');
    btnActAans.disabled = a.actief;
    btnStart.disabled = !(a && k && a.actief && k.actief && k.activering==='handmatig');
    btnAuto.disabled = !(a && k && a.actief && k.activering==='automatisch');
    btnToggle.textContent = (k? k.actief: a.actief)? 'Deactiveren':'Activeren';

    if(activeTab==='def'){
      panel.innerHTML = `
        <div class="kop-card">
          <h3 style="margin-top:0">Definitie ${k? '— Koppeling': '— Aansluiting'}</h3>
          ${k? renderDefKopp(a,k): renderDefAans(a)}
        </div>`;
    }
    if(activeTab==='verwerking' && k){ panel.innerHTML = renderVerwerking(k); }
    if(activeTab==='logs' && k){ panel.innerHTML = renderLogs(k); }
    if(activeTab==='uwv'){ panel.innerHTML = renderUWV(a,k); }
  }

  function renderDefAans(a){
    return `<div class="kop-def">
      <div class="kop-field"><label>Status</label><span class="kop-chip ${a.actief?'ok':'warn'}">${a.actief?'Actief':'Inactief'}</span></div>
      <div class="kop-field"><label>Gedeeld met subbedrijven</label><span>${a.gedeeldMetSub?'Ja':'Nee'}</span></div>
      <div class="kop-field"><label>Ingangsdatum</label><span>${a.ingangsdatum||'-'}</span></div>
      <div class="kop-field"><label>Sector</label><span>${a.sector||'-'}</span></div>
      <div class="kop-field"><label>Risicogroep</label><span>${a.risicogroep||'-'}</span></div>
      <div class="kop-field"><label>Loonheffingsnummer</label><span>${a.loonheffing||'-'}</span></div>
      <div class="kop-field"><label>Recapitulatie e-mail</label><span>${a.recapEmail||'-'}</span></div>
      <div class="kop-field"><label>Verbinding</label><span>${a.verbinding?.type||'-'}</span></div>
      <div class="kop-field"><label>Autorisatie</label><span>${a.autorisatie?.gebruikerAanmaken?'Maakt gebruikers aan':'Geen gebruikers-aanmaak'}</span></div>
    </div>
    <p class="kop-help mt">Na inrichten van koppelingen onder een aansluiting moet de aansluiting nog actief gezet worden om te verwerken.</p>`;
  }

  function renderDefKopp(a,k){
    return `<div class="kop-def">
      <div class="kop-field"><label>Type</label><span>${k.type}</span></div>
      <div class="kop-field"><label>Status</label><span class="kop-chip ${k.actief?'ok':'warn'}">${k.actief?'Actief':'Inactief'}</span></div>
      <div class="kop-field"><label>Activering</label><span>${k.activering}</span></div>
      <div class="kop-field"><label>Verbinding</label><span>${k.verbinding}</span></div>
      <div class="kop-field"><label>Onder aansluiting</label><span>${a.naam}</span></div>
      <div class="kop-field"><label>Laatste run</label><span>${k.stats.afgerond} (${k.stats.duur})</span></div>
    </div>`;
  }

  function renderVerwerking(k){
    return `<div class="kop-grid">
      <div class="kop-card">
        <h4>Afgerond</h4>
        <div class="stat-val">${k.stats.afgerond}</div>
        <div class="kop-help">Hoe lang de laatste run duurde: ${k.stats.duur}</div>
      </div>
      <div class="kop-card">
        <h4>Voortgang</h4>
        <div class="progress" aria-label="Voortgang"><span style="width:${k.stats.voortgang}%"></span></div>
        <div class="kop-help">${k.stats.voortgang}%</div>
      </div>
      <div class="kop-card">
        <h4>Verwerkt</h4>
        <div class="stat-val">${k.stats.verwerkt}/${k.stats.aangeboden}</div>
        <div class="kop-help">Aangeboden / verwerkt bestanden</div>
      </div>
      <div class="kop-card">
        <h4>Fouten</h4>
        <div class="stat-val">${k.stats.fouten}</div>
        <div class="kop-help">Aantal niet verwerkte bestanden</div>
      </div>
    </div>`;
  }

  function renderLogs(k){
    const rows = (k.logs||[]).slice(0,200).map(l=> `<tr><td>${new Date(l.ts).toLocaleString()}</td><td><span class="log-badge ${l.level==='error'?'log-error':'log-info'}">${l.level}</span></td><td>${l.msg}</td></tr>`).join('');
    return `<div class="kop-card">
      <h3 style="margin-top:0">Logfiles</h3>
      <table class="log-table"><thead><tr><th>Tijd</th><th>Niveau</th><th>Melding</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="muted">Nog geen logregels.</td></tr>'}</tbody></table>
      <p class="kop-help">Types: <strong>Info</strong> (waarschuwing/informatie, verwerkt) en <strong>Fout</strong> (niet verwerkt).</p>
    </div>`;
  }

  const DIGI_STEPS = [
    {code:'ALS', label:'Aanlevering'},
    {code:'BLS', label:'Blacklist'},
    {code:'VAS', label:'Validatie XML'},
    {code:'AFO', label:'Aflevering'},
    {code:'VAL', label:'Acceptatie UWV'}
  ];
  function renderUWV(a,k){
    const list = k?.meldingen||[];
    const rows = list.map(m=>{
      const steps = DIGI_STEPS.map(s=>{
        const st = m.steps[s.code];
        const stLabel = st?.ok? 'OK' : (st?.code || '-');
        const cls = st?.ok ? 'ok' : (st? 'err':'warn');
        return `<span class="kop-chip ${cls}">${s.code}: ${stLabel}</span>`;
      }).join(' ');
      return `<tr><td>${m.id}</td><td>${m.type}</td><td>${new Date(m.ts).toLocaleString()}</td><td>${steps}</td></tr>`;
    }).join('');
    return `<div class="kop-card">
      <div class="toolbar" style="justify-content:space-between">
        <h3 style="margin:0">UWV Meldingen (DigiZSM)</h3>
        <div class="toolbar">
          <button class="btn" id="uwvWAZO">Simuleer WAZO</button>
          <button class="btn" id="uwv42w">Simuleer 42e week</button>
          <button class="btn" id="uwvAdvance">Volgende status</button>
        </div>
      </div>
      <table class="log-table"><thead><tr><th>Kenmerk</th><th>Type</th><th>Verzonden</th><th>Statuspad</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted">Geen meldingen.</td></tr>'}</tbody></table>
      <p class="kop-help">Meldingen volgen het Digipoort pad: Aanlevering → Blacklist → Validatie XML → Aflevering → Acceptatie. Foutcodes hebben prefix ALS/BLS/VAS/AFO/VAL/STS.</p>
    </div>`;
  }

  function simulateRun(kind){
    const sel = current(); if(!sel.k) return;
    const k = sel.k; const start = Date.now();
    k.stats.voortgang = 0; k.stats.aangeboden = Math.floor(Math.random()*10)+5; k.stats.verwerkt=0; k.stats.fouten=0;
    k.logs.unshift({ts:new Date().toISOString(), level:'info', msg:`Run (${kind}) gestart.`});
    saveKop(state); renderPanel();
    const t = setInterval(()=>{
      k.stats.voortgang = Math.min(100, k.stats.voortgang + Math.floor(Math.random()*25)+10);
      const processed = Math.floor(k.stats.aangeboden * (k.stats.voortgang/100));
      k.stats.verwerkt = Math.min(k.stats.aangeboden, processed);
      if(Math.random()<0.1) { k.stats.fouten += 1; k.logs.unshift({ts:new Date().toISOString(), level:'error', msg:`VAS-001: XML validatie fout op record ${k.stats.verwerkt}.`});}
      saveKop(state); renderPanel();
      if(k.stats.voortgang>=100){
        clearInterval(t);
        k.stats.afgerond = new Date().toLocaleString();
        k.stats.duur = Math.round((Date.now()-start)/1000)+'s';
        k.logs.unshift({ts:new Date().toISOString(), level:'info', msg:`Run afgerond. Verwerkt: ${k.stats.verwerkt}/${k.stats.aangeboden}, fouten: ${k.stats.fouten}.`});
        saveKop(state); renderPanel();
      }
    }, 600);
  }

  function simulateUWV(type){
    const {k}=current(); if(!k) return;
    const id = (typeof crypto!=='undefined' && crypto.randomUUID)? crypto.randomUUID(): ('uwv-'+Math.random().toString(36).slice(2,10));
    const steps = { ALS:{ok:true, code:'OK'}, BLS:{ok:true, code:'OK'}, VAS:null, AFO:null, VAL:null };
    k.meldingen.unshift({id, type, ts:Date.now(), steps});
    saveKop(state); renderPanel();
  }
  function uwvAdvance(){
    const {k}=current(); if(!k || !k.meldingen.length) return;
    const m = k.meldingen[0];
    const order = ['ALS','BLS','VAS','AFO','VAL'];
    for(let i=0;i<order.length;i++){
      const c = order[i];
      if(!m.steps[c]){
        const isOk = Math.random()>0.15;
        m.steps[c] = isOk? {ok:true, code:'OK'} : {ok:false, code:c+'-ERR'};
        break;
      }
    }
    saveKop(state); renderPanel();
  }

  // Top actions
  byId('kopAddAans').onclick = addAansWizard;
  byId('kopAddKopp').onclick = addKoppWizard;
  byId('kopActAans').onclick = ()=>{
    const {a}=current(); if(!a) return;
    if(a.actief) return;
    a.actief = true; saveKop(state); renderAll();
  };
  byId('kopEdit').onclick = ()=>{
    const {a,k}=current();
    if(k && k.actief){
      openConfirm('We adviseren een actieve koppeling eerst te deactiveren vóór bewerken. Nu deactiveren?', ()=>{ k.actief=false; saveKop(state); editKopp(k); });
    }else if(k){ editKopp(k);
    }else{ editAans(a); }
  };
  byId('kopToggle').onclick = ()=>{
    const {a,k}=current();
    if(k){
      if(!a.actief && !k.actief){ openConfirm('Bovenliggende aansluiting is inactief. Activeer eerst de aansluiting.', ()=>{}); return; }
      k.actief = !k.actief; saveKop(state); renderAll();
    }else{
      a.actief = !a.actief; saveKop(state); renderAll();
    }
  };
  byId('kopStart').onclick = ()=> simulateRun('handmatig');
  byId('kopAuto').onclick = ()=> simulateRun('automatisch');

  byId('uwvWAZO')?.addEventListener('click', ()=>simulateUWV('WAZO'));
  byId('uwv42w')?.addEventListener('click', ()=>simulateUWV('42e week'));
  byId('uwvAdvance')?.addEventListener('click', uwvAdvance);

  tabs.forEach(b=> b.addEventListener('click', ()=>{ setActiveTab(b.dataset.tab); renderPanel(); }));
  byId('kopSearch').addEventListener('input', (e)=> renderTree(e.target.value.trim().toLowerCase()));

  function renderAll(){ renderTree(); renderPanel(); }
  renderAll();

  /* Wizards & Editors */
  function addAansWizard(){
    const title=byId('modalTitle'), body=byId('modalBody'); title.textContent='Aansluiting toevoegen';
    let step=1; const data={naam:'', autorisatie:'met', klant:'', pakket:'', versie:'', verbinding:'SFTP', ip:'', endpoint:'', user:'', pw:'', instellingen:{ident:'UUID'}, autor:{}};
    function draw(){
      body.innerHTML = `
        <div class="kop-wiz-steps">${[1,2,3,4,5,6].map(i=>`<span class="step ${i===step?'active':''}">Stap ${i}</span>`).join('')}</div>
        ${step===1?`
          <div class="field"><label>Autorisatie</label>
            <select id="awAuth"><option value="met">Met autorisatie</option><option value="zonder">Zonder autorisatie</option></select>
          </div>
        `:''}
        ${step===2?`
          <div class="row">
            <div class="col-6"><label>Klant</label><input id="awKlant" placeholder="Klantnaam"></div>
            <div class="col-6"><label>Pakket</label><input id="awPakket" placeholder="SIVI pakket"></div>
            <div class="col-6"><label>Versie</label><input id="awVersie" placeholder="vX.Y"></div>
          </div>
        `:''}
        ${step===3?`
          <label>Type verbinding</label>
          <select id="awVerb"><option>SFTP</option><option>Webservice</option></select>
          <div class="row mt">
            <div class="col-6"><label>IP (SFTP)</label><input id="awIP" placeholder="217.119.236.54"></div>
            <div class="col-6"><label>Endpoint (WS)</label><input id="awEP" placeholder="https://sivi-nvs.test.../inbox"></div>
          </div>
        `:''}
        ${step===4?`
          <div class="row">
            <div class="col-6"><label>Identificatie werknemer</label><select id="awIdent"><option>UUID</option><option>IdWrknmr</option><option>Persnr</option></select></div>
            <div class="col-6"><label>Contactpersonen</label><select id="awContact"><option value="verwerk">Verwerken</option><option value="negeer">Negeer</option></select></div>
            <div class="col-6"><label>E-mail notificaties</label><input id="awMail" placeholder="notify@example.com"></div>
          </div>
        `:''}
        ${step===5?`
          <div class="row">
            <div class="col-6"><label>Gebruikers aanmaken</label><select id="awUsers"><option value="ja">Ja</option><option value="nee">Nee</option></select></div>
            <div class="col-6"><label>Gebruikersnaam gebaseerd op</label><select id="awUmode"><option value="email">E-mail</option><option value="persnr">Personeelsnr</option></select></div>
            <div class="col-6"><label>Prefix gebruikersnaam</label><input id="awPrefix" placeholder="ACME-"></div>
            <div class="col-6"><label>Notificatie naar</label><select id="awNotif"><option value="user">Gebruiker</option><option value="admin">Centraal e-mail</option></select></div>
            <div class="col-6"><label>Centraal e-mail</label><input id="awCmail" placeholder="beheer@example.com"></div>
          </div>
        `:''}
        ${step===6?`
          <div class="field"><label>Naam aansluiting</label><input id="awNaam" placeholder="Aansluiting naam"></div>
          <p class="kop-help">Controleer je instellingen en sla op.</p>
        `:''}
        <div class="modal-actions">
          <button class="btn" id="awBack" ${step===1?'disabled':''}>Terug</button>
          <button class="btn primary" id="awNext">${step===6?'Opslaan':'Volgende'}</button>
        </div>`;
      openModal();
      byId('awBack').onclick = ()=>{ step--; draw(); };
      byId('awNext').onclick = ()=>{
        if(step<6){ step++; draw(); }
        else{
          const id = 'A'+Math.random().toString(36).slice(2,6).toUpperCase();
          state.aansluitingen.unshift({id, naam:data.naam||('Nieuwe aansluiting '+id), actief:false, gedeeldMetSub:false, ingangsdatum:'', sector:'', risicogroep:'', loonheffing:'', recapEmail:data.instellingen?.mail||'', verbinding:{type:data.verbinding||'SFTP'}, autorisatie:{}, instellingen:{}, koppelingen:[]});
          state.sel={aansId:id, koppId:null};
          saveKop(state); closeModal(); renderAll();
        }
      };
      ['awVerb','awNaam'].forEach(id=>{
        const el=byId(id); if(!el) return; el.addEventListener('change', ()=>{
          if(id==='awVerb') data.verbinding = el.value;
          if(id==='awNaam') data.naam = el.value;
        });
      });
    }
    draw();
  }

  function addKoppWizard(){
    const {a}=current(); if(!a){ alert('Kies eerst een aansluiting'); return; }
    const title=byId('modalTitle'), body=byId('modalBody'); title.textContent='Koppeling toevoegen';
    body.innerHTML = `
      <div class="row">
        <div class="col-6"><label>Naam</label><input id="kwNaam" placeholder="bijv. verzuimimport + [klant]"></div>
        <div class="col-6"><label>Type</label><select id="kwType"><option value="verzuim">verzuimimport</option><option value="werknemer">werknemerimport</option><option value="organisatie">organisatie import</option></select></div>
      </div>
      <div class="row mt">
        <div class="col-6"><label>Activering</label><select id="kwAct"><option value="handmatig">handmatig</option><option value="automatisch">automatisch</option></select></div>
        <div class="col-6"><label>Verbinding</label><select id="kwVerb"><option>SFTP</option><option>Webservice</option></select></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="kwCancel">Annuleren</button>
        <button class="btn primary" id="kwSave">Opslaan</button>
      </div>`;
    openModal();
    byId('kwCancel').onclick = closeModal;
    byId('kwSave').onclick = ()=>{
      const id='K'+Math.random().toString(36).slice(2,6).toUpperCase();
      const k={ id, naam: byId('kwNaam').value||('koppeling '+id), type: byId('kwType').value, activering: byId('kwAct').value, actief:false, verbinding: byId('kwVerb').value,
        stats:{afgerond:'-', duur:'-', voortgang:0, aangeboden:0, verwerkt:0, fouten:0}, logs:[], meldingen:[] };
      a.koppelingen.unshift(k);
      state.sel={aansId:a.id, koppId:id};
      saveKop(state); closeModal(); renderAll();
    };
  }

  function editKopp(k){
    const title=byId('modalTitle'), body=byId('modalBody'); title.textContent='Koppeling bewerken';
    body.innerHTML = `
      <div class="row">
        <div class="col-6"><label>Naam</label><input id="ekNaam" value="${k.naam}"></div>
        <div class="col-6"><label>Activering</label><select id="ekAct"><option ${k.activering==='handmatig'?'selected':''}>handmatig</option><option ${k.activering==='automatisch'?'selected':''}>automatisch</option></select></div>
      </div>
      <div class="row mt">
        <div class="col-6"><label>Verbinding</label><select id="ekVerb"><option ${k.verbinding==='SFTP'?'selected':''}>SFTP</option><option ${k.verbinding==='Webservice'?'selected':''}>Webservice</option></select></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="ekCancel">Annuleren</button>
        <button class="btn primary" id="ekSave">Opslaan</button>
      </div>`;
    openModal();
    byId('ekCancel').onclick = closeModal;
    byId('ekSave').onclick = ()=>{
      k.naam=byId('ekNaam').value||k.naam; k.activering=byId('ekAct').value; k.verbinding=byId('ekVerb').value;
      saveKop(state); closeModal(); renderAll();
    };
  }

  function editAans(a){
    const title=byId('modalTitle'), body=byId('modalBody'); title.textContent='Aansluiting bewerken';
    body.innerHTML = `
      <div class="row">
        <div class="col-6"><label>Naam</label><input id="eaNaam" value="${a.naam}"></div>
        <div class="col-6"><label>Actief</label><select id="eaAct"><option ${a.actief?'selected':''}>true</option><option ${!a.actief?'selected':''}>false</option></select></div>
      </div>
      <div class="row mt">
        <div class="col-6"><label>Gedeeld met sub</label><select id="eaSub"><option ${a.gedeeldMetSub?'selected':''}>true</option><option ${!a.gedeeldMetSub?'selected':''}>false</option></select></div>
        <div class="col-6"><label>Ingangsdatum</label><input id="eaIngang" type="date" value="${a.ingangsdatum||''}"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="eaCancel">Annuleren</button>
        <button class="btn primary" id="eaSave">Opslaan</button>
      </div>`;
    openModal();
    byId('eaCancel').onclick = closeModal;
    byId('eaSave').onclick = ()=>{
      a.naam=byId('eaNaam').value||a.naam; a.actief=(byId('eaAct').value==='true'); a.gedeeldMetSub=(byId('eaSub').value==='true'); a.ingangsdatum=byId('eaIngang').value||a.ingangsdatum;
      saveKop(state); closeModal(); renderAll();
    };
  }
}
navigate();
window.addEventListener('error', function(e){
  try{
    var div = document.getElementById('errOverlay');
    if(!div){
      div = document.createElement('div'); div.id='errOverlay';
      div.style.cssText='position:fixed;left:8px;bottom:8px;background:#fff3f3;border:1px solid #f99;padding:8px 12px;border-radius:8px;z-index:99999;font:12px/1.3 system-ui;max-width:60%';
      document.body.appendChild(div);
    }
    div.textContent = 'JS-fout: ' + (e.message||'') + (e.filename?(' @ '+e.filename+':'+e.lineno):'');
  }catch(_){}
});

  </script>

  <script>
    // Mount Functiemanagement in this standalone page
    (function() {
      var host = document.getElementById('app');
      var tpl = document.getElementById('tpl-functies');
      if (!tpl) {
        document.body.innerHTML = '<p>Template tpl-functies niet gevonden.</p>';
        return;
      }
      host.innerHTML = tpl.innerHTML;
      if (typeof initFunctions === 'function') {
        try { initFunctions(); }
        catch (e) { console.error('initFunctions error', e); }
      } else {
        console.warn('initFunctions() is niet beschikbaar.');
      }
    })();
  </script>
</body>
</html>
