const $ = (sel, root=document)=>root.querySelector(sel);
const $$ = (sel, root=document)=>Array.from(root.querySelectorAll(sel));

const state = {
  workbook: JSON.parse(JSON.stringify(INLINE_WORKBOOK_DATA)),
  currentSheet: 0,
  editMode: false,
  log: []
};

function log(msg){
  const t = new Date().toISOString();
  state.log.push(`${t}  ${msg}`);
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  return e;
}

function isX(val){
  if (val == null) return false;
  const t = String(val).trim();
  return t.length === 1 && (t === 'X' || t === 'x' || t === '✗' || t === '✓' || t === '✔');
}

function applyXFormat(td){
  const v = td.innerText;
  if (isX(v)) {
    td.classList.add('xmark');
    // Normaliseer naar hoofdletter X om consistent te zijn met Excel-export
    const ch = v.trim();
    if (ch !== 'X') td.innerText = 'X';
  } else {
    td.classList.remove('xmark');
  }
}

function renderTabs(){
  const tabs = $('.tabs');
  tabs.innerHTML = '';
  state.workbook.sheets.forEach((s, idx)=>{
    const t = el('button', {class: 'tab' + (idx===state.currentSheet ? ' active' : ''), onclick: ()=>{state.currentSheet=idx; renderTable(); renderTabs(); log(`switch to sheet: ${s.name}`);}}, [s.name]);
    tabs.appendChild(t);
  });
}

function csvEscape(value){
  if (value==null) return '';
  const v = String(value);
  if (/[;"\n,]/.test(v)) return `"${v.replace(/"/g,'""')}"`;
  return v;
}

function download(filename, content, mime='text/plain'){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = el('a', {href: url, download: filename});
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(url);
  a.remove();
}

function tableToData(){
  const tbl = $('#grid');
  const rows = [];
  const trs = $$('tbody tr', tbl);
  for (const tr of trs){
    const tds = $$('td', tr).map(td=>td.innerText);
    rows.push(tds);
  }
  const header = $$('thead th', tbl).map(th => th.innerText);
  return [header].concat(rows);
}

function renderTable(){
  const mount = $('#table-mount');
  const s = state.workbook.sheets[state.currentSheet];
  mount.innerHTML = '';
  const table = el('table', {id:'grid', class: state.editMode?'edit-on':''});
  const rows = s.rows || [];
  const header = rows.length ? rows[0] : [];
  const body = rows.length ? rows.slice(1) : [];
  const thead = el('thead');
  const thr = el('tr');
  header.forEach(h=> thr.appendChild(el('th', {}, [h === '' ? '' : h])));
  thead.appendChild(thr);
  const tbody = el('tbody');
  body.forEach(r=>{
    const tr = el('tr');
    header.forEach((_, ci)=>{
      const cellVal = r[ci] ?? '';
      const td = el('td', {contenteditable: state.editMode ? 'true':'false'});
      td.innerText = cellVal;
      applyXFormat(td);
      td.addEventListener('input', ()=>applyXFormat(td));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  mount.appendChild(table);
  $('#activeSheetName').innerText = s.name;
}

function toggleEdit(){
  state.editMode = !state.editMode;
  renderTable();
  $('#btnEdit').classList.toggle('primary', state.editMode);
  $('#btnEdit').innerText = state.editMode ? 'Bewerken: AAN' : 'Bewerken: UIT';
  log(`edit mode ${state.editMode ? 'on':'off'}`);
}

function saveToMemory(){
  const s = state.workbook.sheets[state.currentSheet];
  const data = tableToData();
  s.rows = data;
  s.nrows = data.length;
  s.ncols = Math.max(...data.map(r=>r.length));
  const key = `matrix_v6_${state.workbook.source_file}`;
  localStorage.setItem(key, JSON.stringify(state.workbook));
  log(`saved sheet "${s.name}" to localStorage key=${key}`);
  alert('Opgeslagen in deze browser.');
}

function tryRestore(){
  const key = `matrix_v6_${state.workbook.source_file}`;
  const raw = localStorage.getItem(key);
  if (!raw){
    alert('Geen lokale versie gevonden.');
    return;
  }
  try {
    const wb = JSON.parse(raw);
    state.workbook = wb;
    renderTabs();
    renderTable();
    log(`herstel vanuit localStorage key=${key}`);
  } catch(e){
    alert('Herstellen mislukt: ' + e.message);
  }
}

function exportCSV(){
  const s = state.workbook.sheets[state.currentSheet];
  const name = s.name.replace(/[^\w\-]+/g, '_').toLowerCase();
  const rows = s.rows || [];
  const csv = rows.map(r => r.map(csvEscape).join(';')).join('\n');
  download(`${name}.csv`, csv, 'text/csv;charset=utf-8;header=present');
  log(`export csv: ${name}.csv`);
}

function exportJSON(){
  const s = state.workbook.sheets[state.currentSheet];
  download(`${s.name.replace(/[^\w\-]+/g, '_').toLowerCase()}.json`, JSON.stringify(s, null, 2), 'application/json');
  log(`export json: ${s.name}`);
}

function backupAll(){
  const stamp = new Date().toISOString().replace(/[:\.]/g,'-');
  download(`matrix_web_backup_${stamp}.json`, JSON.stringify(state.workbook, null, 2), 'application/json');
  log('backup all sheets');
}

function restoreFromFile(){
  const inp = el('input', {type:'file', accept:'application/json'});
  inp.addEventListener('change', (ev)=>{
    const f = ev.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try {
        const wb = JSON.parse(e.target.result);
        if (!wb.sheets) throw new Error('Bestand bevat geen "sheets"');
        state.workbook = wb;
        state.currentSheet = 0;
        renderTabs(); renderTable();
        log(`restore from file: ${f.name}`);
      } catch(err){
        alert('Restore mislukt: ' + err.message);
      }
    };
    reader.readAsText(f);
  });
  inp.click();
}

function downloadLog(){
  const stamp = new Date().toISOString().replace(/[:\.]/g,'-');
  download(`matrix_web_log_${stamp}.txt`, state.log.join('\n'), 'text/plain');
}

function filterTable(q){
  q = (q||'').toLowerCase();
  const tbl = $('#grid');
  const trs = $$('tbody tr', tbl);
  trs.forEach(tr=>{
    const hay = tr.innerText.toLowerCase();
    tr.style.display = hay.includes(q) ? '' : 'none';
  });
}

window.addEventListener('DOMContentLoaded', ()=>{
  renderTabs();
  renderTable();
  log('page ready');
  $('#btnEdit').addEventListener('click', toggleEdit);
  $('#btnSave').addEventListener('click', saveToMemory);
  $('#btnBackup').addEventListener('click', backupAll);
  $('#btnRestore').addEventListener('click', restoreFromFile);
  $('#btnExportCSV').addEventListener('click', exportCSV);
  $('#btnExportJSON').addEventListener('click', exportJSON);
  $('#btnDownloadLog').addEventListener('click', downloadLog);
  $('#btnLocalRestore').addEventListener('click', tryRestore);
  $('#q').addEventListener('input', (e)=>filterTable(e.target.value));
});

  </script>
</body>
